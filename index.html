<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Car For Sale BD - Showroom Simulator</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;overflow:hidden;touch-action:none;color:#fff}
#top{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;padding:8px;background:linear-gradient(#000,#0000);z-index:10}
.badge{background:rgba(0,0,0,0.7);border:1px solid #333;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:13px}
.badge span{color:#facc15}
#worldBtns{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
.wbtn{background:#111;border:2px solid #facc15;color:#facc15;padding:10px 14px;border-radius:10px;font-weight:bold}
.wbtn.active{background:#facc15;color:#000}
#actions{position:fixed;bottom:0;width:100%;background:#0f172a;display:flex;gap:6px;padding:8px;overflow-x:auto;z-index:10;border-top:2px solid #facc15}
.abtn{background:#1e293b;border:1px solid #334155;color:#fff;padding:10px 12px;border-radius:10px;white-space:nowrap;font-weight:bold}
.abtn.green{background:#22c55e}
#joy{position:fixed;bottom:130px;left:15px;width:90px;height:90px;background:rgba(255,255,255,0.08);border-radius:50%;border:2px solid rgba(255,255,255,0.2);z-index:10}
#stick{width:40px;height:40px;background:#facc15;border-radius:50%;position:absolute;left:25px;top:25px}
#listPanel{position:fixed;right:10px;top:60px;width:280px;max-height:60vh;overflow-y:auto;background:rgba(10,15,30,0.95);border-radius:12px;padding:10px;border:2px solid #334155;z-index:9}
.card{background:#1e293b;padding:8px;border-radius:8px;margin-bottom:6px;border-left:3px solid #facc15;font-size:13px}
canvas{display:block}
#cross{position:fixed;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);z-index:5;opacity:0.5}
#cross:before,#cross:after{content:'';position:absolute;background:#fff}
#cross:before{width:20px;height:2px;top:9px;left:0}
#cross:after{width:2px;height:20px;left:9px;top:0}
</style>
</head>
<body>
<div id="top">
<div class="badge">৳ <span id="money">75000</span></div>
<div class="badge">🏢 <span id="show">0/4</span> Showroom</div>
<div class="badge">⭐ LVL <span id="lvl">1</span></div>
</div>

<div id="listPanel">
<div style="color:#facc15;font-weight:bold;text-align:center;border-bottom:1px solid #333;padding-bottom:5px;margin-bottom:5px" id="locName">🏢 SHOWROOM</div>
<div id="carList">Loading...</div>
<button class="abtn" style="width:100%;margin-top:6px" onclick="save()">💾 SAVE</button>
</div>

<div id="worldBtns">
<button class="wbtn active" onclick="gotoShowroom()">🏢 Showroom</button>
<button class="wbtn" onclick="gotoAuction()">🔥 Auction</button>
<button class="wbtn" onclick="gotoMarket()">🏪 Market</button>
<button class="wbtn" onclick="gotoHood()">🏘️ Neighborhood</button>
</div>

<div id="joy"><div id="stick"></div></div>
<div id="cross"></div>

<div id="actions">
<button class="abtn" onclick="inspect()">🔍 দেখো</button>
<button class="abtn" onclick="wash()">🧼 ধোও ৳300</button>
<button class="abtn" onclick="repair()">🔧 ঠিক ৳1000</button>
<button class="abtn green" onclick="sell()">💰 বিক্রি / কেনো</button>
<button class="abtn" onclick="drive()">🚗 চালাও</button>
</div>

<script type="module">
import * as THREE from 'three';
let money=parseInt(localStorage.getItem('bdMoney2')||'75000');
let myCars=JSON.parse(localStorage.getItem('bdCars2')||'[]');
let selected=null, location='showroom';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,40,120);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,0.8));
const sun=new THREE.DirectionalLight(0xffffff,1); sun.position.set(20,30,10); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); scene.add(sun);

// --- BUILD SHOWROOM like screenshot 1 ---
const showroomGroup=new THREE.Group(); scene.add(showroomGroup);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60), new THREE.MeshStandardMaterial({color:0xe8e8ea, roughness:0.1, metalness:0.1}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; showroomGroup.add(floor);

// Glass walls - screenshot 1 style
function glassWall(x,z,w,h,rot=0){
 const geo=new THREE.PlaneGeometry(w,h); const mat=new THREE.MeshPhysicalMaterial({color:0xaaddff, transparent:true, opacity:0.2, roughness:0, metalness:0.5, side:2});
 const m=new THREE.Mesh(geo,mat); m.position.set(x,h/2,z); m.rotation.y=rot; showroomGroup.add(m);
 // frame
 const frame=new THREE.Mesh(new THREE.BoxGeometry(w+0.2,0.2,h+0.2), new THREE.MeshStandardMaterial({color:0xffffff})); 
}
glassWall(-30,0,60,12,0); glassWall(0,0,60,12,Math.PI/2);

// Platforms with neon like screenshot 1
const platforms=[];
function platform(x,z,color){
 const base=new THREE.Mesh(new THREE.BoxGeometry(7,0.3,7), new THREE.MeshStandardMaterial({color:0x111}));
 base.position.set(x,0.15,z); base.receiveShadow=true; showroomGroup.add(base);
 const neon=new THREE.Mesh(new THREE.BoxGeometry(7.2,0.1,7.2), new THREE.MeshStandardMaterial({color:color, emissive:color, emissiveIntensity:2}));
 neon.position.set(x,0.35,z); showroomGroup.add(neon);
 platforms.push({x,z,car:null});
}
platform(-12,8,0x00ffff); platform(-2,8,0xff00ff); platform(8,8,0x00ff00); platform(18,8,0xff0000);

// --- AUCTION building like screenshot 4 ---
const auctionGroup=new THREE.Group(); auctionGroup.visible=false; scene.add(auctionGroup);
const aFloor=new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshStandardMaterial({color:0x444a50})); aFloor.rotation.x=-Math.PI/2; aFloor.receiveShadow=true; auctionGroup.add(aFloor);
const aucBuilding=new THREE.Mesh(new THREE.BoxGeometry(40,8,6), new THREE.MeshStandardMaterial({color:0x888})); aucBuilding.position.set(0,4,-10); auctionGroup.add(aucBuilding);
const aucText=createTextSprite("CAR AUCTION",0xFF0000); aucText.position.set(0,10,-10); auctionGroup.add(aucText);
for(let i=0;i<4;i++){
 const door=new THREE.Mesh(new THREE.BoxGeometry(7,5,0.5), new THREE.MeshStandardMaterial({color:0x222})); door.position.set(-15+i*10,2.5,-7); auctionGroup.add(door);
 const price=new THREE.Mesh(new THREE.PlaneGeometry(5,1), new THREE.MeshStandardMaterial({color:0x000, emissive:0x00ff00, emissiveIntensity:1})); price.position.set(-15+i*10,6,-7.5); auctionGroup.add(price);
 platform(-15+i*10,0,0xff0000); // reuse for auction
}

// --- HOOD - like screenshot 3 ---
const hoodGroup=new THREE.Group(); hoodGroup.visible=false; scene.add(hoodGroup);
const road=new THREE.Mesh(new THREE.PlaneGeometry(20,200), new THREE.MeshStandardMaterial({color:0x222})); road.rotation.x=-Math.PI/2; road.position.y=0.02; hoodGroup.add(road);
for(let i=0;i<8;i++){
 const house=new THREE.Mesh(new THREE.BoxGeometry(8,6,10), new THREE.MeshStandardMaterial({color:i%2?0xeee8d5:0xc8d8e8})); house.position.set((i%2?15:-15),3,i*20-40); house.castShadow=true; hoodGroup.add(house);
}

function createTextSprite(text,color){
 const c=document.createElement('canvas'); c.width=512;c.height=128; const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.font='bold 60px Arial'; ctx.fillText(text,10,80);
 const tex=new THREE.CanvasTexture(c); const mat=new THREE.SpriteMaterial({map:tex}); const s=new THREE.Sprite(mat); s.scale.set(20,5,1); return s;
}

// Cars
const carMeshes=[]; const carColors=[0xff3300,0xffcc00,0x0088ff,0x22c55e,0x111111,0xffffff];
function spawnCarMesh(data,x,z){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.8,4), new THREE.MeshStandardMaterial({color:data.color||carColors[Math.floor(Math.random()*carColors.length)], roughness:0.2, metalness:0.6})); body.position.y=0.9; body.castShadow=true; g.add(body);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.6,2), new THREE.MeshStandardMaterial({color:0x111})); roof.position.set(0,1.5,-0.2); g.add(roof);
 const wheelG=new THREE.CylinderGeometry(0.35,0.35,0.2,16); const wheelM=new THREE.MeshStandardMaterial({color:0x111});
 [[-0.9,0.35,1.2],[0.9,0.35,1.2],[-0.9,0.35,-1.2],[0.9,0.35,-1.2]].forEach(p=>{let w=new THREE.Mesh(wheelG,wheelM); w.rotation.z=Math.PI/2; w.position.set(...p); g.add(w)});
 g.position.set(x,0,z); g.userData=data; scene.add(g); carMeshes.push(g); return g;
}

// Init my cars on platforms
myCars.forEach((c,i)=>{ if(i<platforms.length) { spawnCarMesh(c,platforms[i].x,platforms[i].z); platforms[i].car=c; }});

// NPC
function npc(x,z){ const m=new THREE.Mesh(new THREE.CapsuleGeometry(0.4,1.2,4,8), new THREE.MeshStandardMaterial({color:0x222})); m.position.set(x,1,z); scene.add(m); }

// Controls - FPS like Car For Sale
camera.position.set(0,1.7,15);
let yaw=0,pitch=0,keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let drag=false,lx=0,ly=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{
 if(!drag) return; yaw-=(e.clientX-lx)*0.004; pitch-=(e.clientY-ly)*0.004; pitch=Math.max(-1.3,Math.min(1.3,pitch)); lx=e.clientX;ly=e.clientY;
});
let jx=0,jy=0; const joy=document.getElementById('joy'), stick=document.getElementById('stick');
joy.addEventListener('touchmove',e=>{let r=joy.getBoundingClientRect();let t=e.touches[0];let x=t.clientX-(r.left+45),y=t.clientY-(r.top+45);let d=Math.hypot(x,y);if(d>35){x=x/d*35;y=y/d*35} stick.style.transform=`translate(${x}px,${y}px)`; jx=x/35;jy=y/35;});
joy.addEventListener('touchend',()=>{stick.style.transform='';jx=0;jy=0});

function updateMove(){
 let f=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
 let r=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
 let sp=0.12;
 if(keys['w']||jy<-0.2) camera.position.addScaledVector(f,sp);
 if(keys['s']||jy>0.2) camera.position.addScaledVector(f,-sp);
 if(keys['a']||jx<-0.2) camera.position.addScaledVector(r,-sp);
 if(keys['d']||jx>0.2) camera.position.addScaledVector(r,sp);
 camera.rotation.order='YXZ'; camera.rotation.y=yaw; camera.rotation.x=pitch;
 // ray for selection
 const ray=new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=ray.intersectObjects(carMeshes,true); 
 if(hits.length){ let root=hits[0].object.parent; while(root.parent && root.parent.type!='Scene') root=root.parent; selected=root.userData; document.getElementById('carList').innerHTML=`<div class="card" style="border-color:#facc15"><b>${selected.name||'Car'} ${selected.cond||80}%</b><br>Buy ৳${selected.buy||0} Sell ৳${Math.floor((selected.buy||10000)*1.3)}<br><small>Tap actions below</small></div>`; }
}

function gotoShowroom(){location='showroom'; showroomGroup.visible=true; auctionGroup.visible=false; hoodGroup.visible=false; document.querySelectorAll('.wbtn').forEach(b=>b.classList.remove('active')); event.target.classList.add('active'); document.getElementById('locName').innerText='🏢 SHOWROOM - তোমার দোকান';}
window.gotoShowroom=()=>{showroomGroup.visible=true; auctionGroup.visible=false; hoodGroup.visible=false; document.getElementById('locName').innerText='🏢 SHOWROOM'; updateBtn(0)};
window.gotoAuction=()=>{showroomGroup.visible=false; auctionGroup.visible=true; hoodGroup.visible=false; document.getElementById('locName').innerText='🔥 CAR AUCTION - বিডিং'; spawnAuctionCars(); updateBtn(1)};
window.gotoMarket=()=>{showroomGroup.visible=false; auctionGroup.visible=false; hoodGroup.visible=true; document.getElementById('locName').innerText='🏪 CAR MARKET - রাস্তার হাট'; updateBtn(2)};
window.gotoHood=()=>{showroomGroup.visible=false; auctionGroup.visible=false; hoodGroup.visible=true; document.getElementById('locName').innerText='🏘️ NEIGHBORHOOD - বাড়ি বাড়ি গাড়ি'; updateBtn(3)};
function updateBtn(i){document.querySelectorAll('.wbtn').forEach((b,idx)=>b.classList.toggle('active',idx==i))}

function spawnAuctionCars(){
 carMeshes.forEach(m=>auctionGroup.remove(m)); // clear
 const names=['G Wagon','Audi R8','Lambo','Supra'];
 for(let i=0;i<3;i++){ let d={name:names[i],cond:60+Math.random()*30|0,buy:40000+i*30000,color:carColors[i]}; let m=spawnCarMesh(d,-15+i*10,0); auctionGroup.add(m); npc(-13+i*10,3); }
}
window.inspect=()=>{if(!selected) return alert('গাড়ির দিকে তাকাও + কাছে যাও'); alert(`🚗 ${selected.name}\nCondition: ${selected.cond}%\nতুমি কিনছিলা: ৳${selected.buy}\nএখন বিক্রি দাম: ৳${Math.floor(selected.buy*1.4)}`);};
window.wash=()=>{if(!selected) return alert('গাড়ি Select করো'); if(money<300) return alert('টাকা নাই'); money-=300; selected.cond=Math.min(100,selected.cond+10); save();};
window.repair=()=>{if(!selected) return alert('গাড়ি Select করো'); if(money<1000) return alert('টাকা নাই'); money-=1000; selected.cond=Math.min(100,selected.cond+25); save();};
window.sell=()=>{
 if(!selected) return alert('গাড়ির সামনে যাও');
 if(myCars.includes(selected)){ // sell
   let price=Math.floor(selected.buy*1.4 + selected.cond*200); money+=price; myCars=myCars.filter(c=>c!=selected); scene.remove(carMeshes.find(m=>m.userData==selected)); alert(`বিক্রি Done! ৳${price} পাইছো! Customer: "Thanks bro!"`); selected=null;
 } else { // buy
   if(money<selected.buy) return alert('টাকা নাই!'); money-=selected.buy; myCars.push(selected); alert(`কিনে ফেলছো! এখন Showroom এ নিয়ে যাও`); 
 }
 save();
};
window.drive=()=>{if(!selected) return; alert('VROOOM! গাড়ি চালাচ্ছো! W দিয়ে সামনে যাও! (Next update এ Driving Physics আসবে)'); camera.position.set(selected.x||0,1.7,selected.z||0);};

window.save=()=>{localStorage.setItem('bdMoney2',money); localStorage.setItem('bdCars2',JSON.stringify(myCars)); document.getElementById('money').innerText=money; document.getElementById('show').innerText=`${myCars.length}/4`; let d=document.createElement('div'); d.textContent='✅ Saved'; d.style.cssText='position:fixed;top:50px;left:50%;transform:translateX(-50%);background:#22c55e;padding:5px 12px;border-radius:20px;z-index:20'; document.body.appendChild(d); setTimeout(()=>d.remove(),1000);};

function loop(){requestAnimationFrame(loop); updateMove(); renderer.render(scene,camera); document.getElementById('money').innerText=money; document.getElementById('show').innerText=myCars.length+'/4';}
loop();
save();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
