<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিডি কার For Sale</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #050505; color: #fff; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; box-sizing: border-box; }
        .interactive { pointer-events: auto; }
        
        #header { display: flex; justify-content: space-between; align-items: start; }
        #logo-container { text-align: center; background: rgba(0, 0, 0, 0.8); padding: 15px 30px; border-radius: 12px; border: 2px solid #00d2ff; box-shadow: 0 0 25px rgba(0, 210, 255, 0.5); }
        h1 { font-size: 38px; margin: 0; letter-spacing: 4px; color: #fff; text-transform: uppercase; background: linear-gradient(45deg, #fff, #00d2ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #shop-name-display { font-size: 20px; color: #00d2ff; margin-top: 5px; font-weight: bold; }

        #dashboard { background: rgba(0, 0, 0, 0.85); border: 1px solid #333; padding: 20px; border-radius: 15px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); backdrop-filter: blur(10px); }
        .input-group { margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; background: #111; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; margin-top: 5px; }
        input[type="text"]:focus { border-color: #00d2ff; outline: none; }
        .btn { background: linear-gradient(45deg, #00d2ff, #0099ff); color: #fff; border: none; padding: 12px 20px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; transition: 0.3s; margin-top: 10px; width: 100%; text-transform: uppercase; box-shadow: 0 4px 15px rgba(0, 153, 255, 0.3); }
        .btn:hover { background: linear-gradient(45deg, #0099ff, #00d2ff); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5); }
        .btn-secondary { background: #222; box-shadow: none; }
        .btn-secondary:hover { background: #333; }
        
        #stats { margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; font-size: 15px; line-height: 1.8; }
        .stat-item { display: flex; justify-content: space-between; }
        .stat-value { color: #00d2ff; font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); }
        .modal-content { background: #111; border: 1px solid #444; padding: 30px; border-radius: 15px; width: 400px; text-align: center; box-shadow: 0 0 30px #00d2ff; }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: #fff; }

        #notification { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.9); color: #00d2ff; padding: 15px 30px; border-radius: 8px; border: 1px solid #00d2ff; display: none; font-weight: bold; z-index: 20; animation: fadeInOut 3s; }
        @keyframes fadeInOut { 0%, 100% { opacity: 0; } 10%, 90% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-container">
        <div id="header">
            <div id="logo-container">
                <h1>বিডি কার For Sale</h1>
                <div id="shop-name-display">আমার শপ</div>
            </div>
            <div id="dashboard" class="interactive">
                <div class="input-group">
                    <label for="shop-name-input">দোকানের নাম পরিবর্তন:</label>
                    <input type="text" id="shop-name-input" placeholder="নতুন নাম লিখুন">
                    <button class="btn btn-secondary" onclick="updateShopName()">নাম পরিবর্তন করুন</button>
                </div>
                
                <div id="stats">
                    <div class="stat-item"><span class="stat-label">ক্যাশ:</span> <span class="stat-value" id="cash">৫০,০০০ ৳</span></div>
                    <div class="stat-item"><span class="stat-label">আবহাওয়া:</span> <span class="stat-value" id="weather-display">পরিষ্কার</span></div>
                    <div class="stat-item"><span class="stat-label">লেভেল:</span> <span class="stat-value" id="level-display">১</span></div>
                </div>
            </div>
        </div>

        <div id="actions-panel" class="interactive" style="width: 320px; align-self: flex-end;">
            <button class="btn" onclick="openGarage()">গ্যারেজ খুলুন</button>
            <button class="btn" onclick="visitMarketplace()">কার মার্কেটপ্লেস</button>
            <button class="btn" onclick="startCareer()">ক্যারিয়ার মিশন</button>
        </div>
    </div>

    <div id="garage-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('garage-modal')">&times;</span>
            <h2>গ্যারেজ সিস্টেম</h2>
            <p>এখানে আপনি গাড়ির রঙ ও টিউনিং পরিবর্তন করতে পারবেন।</p>
            <button class="btn" onclick="paintCar()">গাড়ির রঙ বদলান</button>
            <button class="btn btn-secondary" onclick="closeModal('garage-modal')">বন্ধ করুন</button>
        </div>
    </div>

    <div id="marketplace-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('marketplace-modal')">&times;</span>
            <h2>কার মার্কেটপ্লেস</h2>
            <p>কমদামী ও ভাঙাচোরা গাড়ি কিনুন এবং মেরামত করুন।</p>
            <button class="btn" onclick="buyCar()">গাড়ি কিনুন</button>
            <button class="btn btn-secondary" onclick="closeModal('marketplace-modal')">বন্ধ করুন</button>
        </div>
    </div>

    <div id="notification"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(15, 25, 15);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 4096;
        dirLight.shadow.mapSize.height = 4096;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        scene.add(dirLight);

        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1A1A1A, roughness: 0.05, metalness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(100, 50, 0x00d2ff, 0x333333);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const carGroup = new THREE.Group();
        const bodyGeo = new THREE.BoxGeometry(2.2, 0.8, 4.8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.8, roughness: 0.1 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.7;
        body.castShadow = true;
        carGroup.add(body);

        const cockpitGeo = new THREE.BoxGeometry(1.6, 0.6, 2.5);
        const cockpitMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
        const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
        cockpit.position.set(0, 1.4, -0.2);
        cockpit.castShadow = true;
        carGroup.add(cockpit);

        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.6, 32);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        
        for (let i = -1; i <= 1; i += 2) {
            for (let j = -1; j <= 1; j += 2) {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(i * 1.3, 0.4, j * 1.6);
                wheel.castShadow = true;
                carGroup.add(wheel);
            }
        }
        
        scene.add(carGroup);
        camera.position.set(5, 5, 8);
        camera.lookAt(0, 1, 0);

        let cash = 50000;
        let level = 1;
        let isRaining = false;
        let time = 0;

        function updateLighting() {
            time += 0.001;
            const intensity = (Math.sin(time) + 1.5) / 2;
            dirLight.intensity = intensity;
            renderer.setClearColor(new THREE.Color(intensity * 0.05, intensity * 0.1, intensity * 0.15));
        }

        const rainParticles = new THREE.Group();
        const rainCount = 1000;
        const rainGeo = new THREE.BufferGeometry();
        const rainPositions = [];
        for(let i=0; i<rainCount; i++) {
            rainPositions.push(
                (Math.random() - 0.5) * 60,
                Math.random() * 30,
                (Math.random() - 0.5) * 60
            );
        }
        rainGeo.setAttribute('position', new THREE.Float32BufferAttribute(rainPositions, 3));
        const rainMat = new THREE.PointsMaterial({ color: 0xaaaaaa, size: 0.05, transparent: true, opacity: 0.5 });
        const rain = new THREE.Points(rainGeo, rainMat);
        rainParticles.add(rain);

        function toggleWeather() {
            isRaining = !isRaining;
            if (isRaining) {
                scene.add(rainParticles);
                document.getElementById('weather-display').innerText = "বৃষ্টি";
            } else {
                scene.remove(rainParticles);
                document.getElementById('weather-display').innerText = "পরিষ্কার";
            }
        }
        
        function animateRain() {
            if (isRaining) {
                const positions = rainGeo.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] -= 0.2;
                    if (positions[i] < 0) positions[i] = 30;
                }
                rainGeo.attributes.position.needsUpdate = true;
            }
        }

        function updateShopName() {
            const input = document.getElementById('shop-name-input').value;
            if (input.trim() !== "") {
                document.getElementById('shop-name-display').innerText = input;
                showNotification("দোকানের নাম পরিবর্তন করা হয়েছে!");
            }
        }

        function showNotification(message) {
            const note = document.getElementById('notification');
            note.innerText = message;
            note.style.display = 'block';
            setTimeout(() => { note.style.display = 'none'; }, 3000);
        }

        function openGarage() {
            document.getElementById('garage-modal').style.display = 'flex';
        }

        function visitMarketplace() {
            document.getElementById('marketplace-modal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function paintCar() {
            const randomColor = Math.random() * 0xffffff;
            body.material.color.setHex(randomColor);
            showNotification("গাড়ির রঙ পরিবর্তন করা হয়েছে!");
        }

        function buyCar() {
            if (cash >= 20000) {
                cash -= 20000;
                document.getElementById('cash').innerText = cash.toLocaleString() + " ৳";
                showNotification("একটি নতুন গাড়ি কেনা হয়েছে!");
            } else {
                showNotification("পর্যাপ্ত ক্যাশ নেই!");
            }
        }

        function startCareer() {
            level++;
            document.getElementById('level-display').innerText = level;
            showNotification("নতুন ক্যারিয়ার মিশন শুরু হয়েছে!");
            toggleWeather();
        }

        function animate() {
            requestAnimationFrame(animate);
            carGroup.rotation.y += 0.002;
            updateLighting();
            animateRain();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
