<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>DLS26 Style - Real Character</title>
<style>
*{margin:0;box-sizing:border-box;touch-action:none} body{background:#000;color:#fff;font-family:Arial;overflow:hidden}
#field{position:absolute;inset:0;background:linear-gradient(#2ea62e 0%, #1a7a1a 60%, #0f4a0f 100%)}
canvas{width:100%;height:100%;display:block}
.controls{position:absolute;bottom:0;left:0;width:100%;height:150px;display:flex;justify-content:space-between;padding:12px;z-index:10}
.joy{width:120px;height:120px;background:rgba(255,255,255,0.12);border-radius:50%;border:2px solid rgba(255,255,255,0.3);position:relative}
.stick{width:50px;height:50px;background:#fff;border-radius:50%;position:absolute;left:35px;top:35px;box-shadow:0 4px 10px #000}
.abc{display:flex;gap:14px;align-items:center}
.btn{width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,0.5);border:2px solid #fff;color:#fff;font-weight:bold;font-size:18px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.btn:active{background:#fff;color:#000}
.btn.A{border-color:#f1c40f} .btn.B{border-color:#3498db} .btn.C{border-color:#fff}
.top{position:absolute;top:0;width:100%;height:46px;background:rgba(0,0,0,0.7);display:flex;justify-content:space-between;align-items:center;padding:0 14px;z-index:10;border-bottom:2px solid #2ecc71;font-weight:bold}
#menu{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1504305754058-2f08ccd89a0a');background-size:cover;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(20,40,20,0.95);border:3px solid #2ecc71;border-radius:18px;padding:20px;width:95%;max-width:400px;text-align:center}
.mode{width:100%;padding:14px;margin:8px 0;background:#2ecc71;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:15px}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000d;border:2px solid #ff0;padding:16px 24px;border-radius:12px;z-index:30;display:none;text-align:center;font-weight:bold;font-size:20px}
</style>
</head>
<body>
<div class="top"><span id="score">BRA 0-0 ARS</span><span id="modeTxt">DLS26 STYLE</span><span id="time">00:00</span></div>
<div id="field"><canvas id="cv"></canvas><div id="msg"></div><button onclick="goMenu()" style="position:absolute;top:56px;left:10px;z-index:11;background:#0008;color:#fff;border:1px solid #fff;padding:5px 12px;border-radius:6px;font-size:11px">← MENU</button></div>
<div class="controls">
<div class="joy" id="joy"><div class="stick" id="stick"></div></div>
<div class="abc">
<div class="btn C" id="btnC">C</div>
<div class="btn" id="btnB" style="margin-top:40px">B</div>
<div class="btn A" id="btnA" style="margin-top:10px">A</div>
</div>
</div>

<div id="menu">
<div class="card">
<h2 style="color:#2ecc71">DLS26 REAL CHARACTER</h2>
<p style="font-size:12px;color:#aaa;margin:10px 0">তোমার ছবির মতো - Side View, Real Jersey, Free Kick Wall</p>
<button class="mode" onclick="start(1)">1. TRAINING - Free Kick Wall (ছবির মতো)</button>
<button class="mode" onclick="start(2)" style="background:#3498db">2. 1vs1 Dribble Match</button>
<button class="mode" onclick="start(3)" style="background:#f1c40f">3. FINAL BRA vs ARS 5v5</button>
<p style="font-size:10px;color:#888;margin-top:10px">A = SHOOT, B = PASS, C = THROUGH / SKILL - তোমার 2য় ছবির মতো Control</p>
</div>
</div>

<script>
const canvas=document.getElementById('cv'), ctx=canvas.getContext('2d');
let W,H; function rs(){W=canvas.width=canvas.clientWidth*2; H=canvas.height=canvas.clientHeight*2} window.onresize=()=>{canvas.clientWidth=field.clientWidth; canvas.clientHeight=field.clientHeight; rs()}; rs();
let mode=1, run=false, players=[], my=[], opp=[], ball={x:0,y:0}, ballV={x:0,y:0}, owner=null, active=0, scoreM=0, scoreO=0, t=0, timer, joy={dx:0,dy:0,a:false};

class DLSPlayer{
 constructor(x,y,team,num,color){
   this.x=x; this.y=y; this.team=team; this.num=num; this.color=color; this.vx=0; this.vy=0; this.red=false;
   this.frame=0;
 }
 draw(){
   if(this.red) return;
   ctx.save(); ctx.translate(this.x,this.y);
   // shadow
   ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0,18,18,7,0,0,Math.PI*2); ctx.fill();
   // legs
   let moving=Math.hypot(this.vx,this.vy)>0.6;
   let swing=moving?Math.sin(Date.now()*0.015+this.x)*9:0;
   ctx.fillStyle='#0a0a0a'; ctx.fillRect(-7+swing,6,6,14); ctx.fillRect(3-swing,6,6,14);
   ctx.fillStyle=this.team=='my'?'#ffcc00':'#3498db'; // socks
   ctx.fillRect(-7+swing,6,6,8); ctx.fillRect(3-swing,6,6,8);
   // shorts
   ctx.fillStyle='#fff'; if(this.team=='opp') ctx.fillStyle='#0022aa';
   ctx.fillRect(-9,-2,18,10);
   // jersey
   ctx.fillStyle=this.color; ctx.fillRect(-12,-18,24,18);
   ctx.fillStyle='#000'; ctx.font='bold 13px Arial'; ctx.textAlign='center'; ctx.fillText(this.num,this.x<0?0:0, -5);
   // head
   ctx.fillStyle='#ffdbac'; ctx.beginPath(); ctx.arc(0,-24,9,0,Math.PI*2); ctx.fill();
   // hair
   ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(0,-30,9,0,Math.PI*1); ctx.fill();
   ctx.restore();
   if(this.team=='my' && players.indexOf(this)==active){
     ctx.strokeStyle='#ff0'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(this.x,this.y-4,22,0,Math.PI*2); ctx.stroke();
   }
 }
}

function msg(txt,c='#ff0',ms=1500){let m=document.getElementById('msg'); m.innerHTML=txt; m.style.borderColor=c; m.style.display='block'; setTimeout(()=>m.style.display='none',ms);}

function init(){
 players=[]; my=[]; opp=[]; owner=null; ballV={x:0,y:0}; let fw=W, fh=H;
 if(mode==1){
   // Exact like your screenshot: red 11 vs blue wall
   let me=new DLSPlayer(220,fh-120,'my',11,'#e11'); // your 11
   players.push(me); my.push(me); active=0;
   // wall 4 blue + gk
   for(let i=0;i<4;i++){ let p=new DLSPlayer(fw/2-60+i*35, fh*0.45, 'opp', i+2, '#3498db'); players.push(p); opp.push(p); }
   let gk=new DLSPlayer(fw-180, fh*0.45, 'opp', 1, '#f1c40f'); players.push(gk); opp.push(gk);
   ball={x:me.x+30,y:me.y}; owner=me;
 } else if(mode==2){
   let me=new DLSPlayer(200,fh/2,'my',10,'#ffeb3b'); let o=new DLSPlayer(fw-300,fh/2,'opp',5,'#3498db');
   players=[me,o]; my=[me]; opp=[o]; active=0; ball={x:me.x+28,y:me.y}; owner=me;
 } else {
   let myPos=[[180,fh/2,11],[300,fh*0.3,7],[300,fh*0.7,8],[420,fh*0.35,9],[420,fh*0.65,10]];
   let oppPos=[[W-180,fh/2,1],[W-300,fh*0.3,2],[W-300,fh*0.7,3],[W-420,fh*0.35,4],[W-420,fh*0.65,5]];
   myPos.forEach(p=>{let pl=new DLSPlayer(p[0],p[1],'my',p[2],'#ff0000'); players.push(pl); my.push(pl)});
   oppPos.forEach(p=>{let pl=new DLSPlayer(p[0],p[1],'opp',p[2],'#3498db'); players.push(pl); opp.push(pl)});
   active=0; ball={x:my[0].x+28,y:my[0].y}; owner=my[0];
 }
 document.getElementById('score').innerText=mode==3?`BRA ${scoreM}-${scoreO} ARS`:`BD ${scoreM}-${scoreO} OPP`;
}

function start(m){mode=m; scoreM=0; scoreO=0; t=0; document.getElementById('menu').style.display='none'; init(); run=true; clearInterval(timer); timer=setInterval(()=>{t++; let mm=String(Math.floor(t/60)).padStart(2,'0'); let ss=String(t%60).padStart(2,'0'); document.getElementById('time').innerText=mm+':'+ss},1000); loop();}

function checkGoal(){
 let fw=W, fh=H;
 if(ball.x>fw-40 && ball.y>fh*0.35 && ball.y<fh*0.55){
   scoreM++; document.getElementById('score').innerText=mode==3?`BRA ${scoreM}-${scoreO} ARS`:`BD ${scoreM}-${scoreO} OPP`;
   msg('GOOOAL! ⚽','green',2000); setTimeout(init,1400); return true;
 }
 if(ball.x<40 && ball.y>fh*0.35 && ball.y<fh*0.55){ scoreO++; msg('Opp Goal!','red'); setTimeout(init,1200); return true;}
 if(ball.x<0||ball.x>fw||ball.y<0||ball.y>fh){init(); return true;}
 return false;
}

function tackle(){
 let me=my[active]; if(!me||me.red) return;
 let target=owner && opp.includes(owner)?owner:opp.reduce((a,b)=>Math.hypot(ball.x-a.x,ball.y-a.y)<Math.hypot(ball.x-b.x,ball.y-b.y)?a:b);
 if(Math.hypot(me.x-target.x,me.y-target.y)<60){owner=me; ballV={x:0,y:0}; ball.x=me.x+22; ball.y=me.y; msg('TACKLE!','green',600);}
}
function shoot(){
 if(!owner||!my.includes(owner)) return;
 let fw=W, fh=H; let gy=fh*0.45+(Math.random()-0.5)*60; let ang=Math.atan2(gy-ball.y,fw-ball.x); let pow=mode==1?15:17; ballV.x=Math.cos(ang)*pow; ballV.y=Math.sin(ang)*pow; owner=null;
}
function pass(){
 if(!owner||!my.includes(owner)||mode==1) return;
 let cur=my[active]; let best=null,d=999; my.forEach((p,i)=>{if(i!=active){let dist=Math.hypot(p.x-cur.x,p.y-cur.y); if(dist>50&&dist<d){d=dist; best=p}}});
 if(best){let ang=Math.atan2(best.y-ball.y,best.x-ball.x); ballV.x=Math.cos(ang)*10; ballV.y=Math.sin(ang)*10; owner=null;}
}

document.getElementById('btnC').addEventListener('touchstart',tackle);
document.getElementById('btnA').addEventListener('touchstart',shoot);
document.getElementById('btnB').addEventListener('touchstart',pass);
const joyEl=document.getElementById('joy'), stickEl=document.getElementById('stick');
joyEl.addEventListener('touchstart',e=>{joy.a=true; e.preventDefault()},{passive:false});
joyEl.addEventListener('touchmove',e=>{
 let r=joyEl.getBoundingClientRect(); let tt=e.touches[0]; let dx=tt.clientX-(r.left+60), dy=tt.clientY-(r.top+60);
 let d=Math.min(50,Math.hypot(dx,dy)), ang=Math.atan2(dy,dx); joy.dx=Math.cos(ang)*d/50; joy.dy=Math.sin(ang)*d/50;
 stickEl.style.left=35+joy.dx*35+'px'; stickEl.style.top=35+joy.dy*35+'px'; e.preventDefault();
},{passive:false});
joyEl.addEventListener('touchend',()=>{joy.a=false; joy.dx=0; joy.dy=0; stickEl.style.left='35px'; stickEl.style.top='35px';});

function loop(){
 if(!run) return;
 let me=my[active];
 if(me&&!me.red&&joy.a){me.vx=joy.dx*4.5; me.vy=joy.dy*4.5; me.x+=me.vx; me.y+=me.vy; me.x=Math.max(30,Math.min(W-30,me.x)); me.y=Math.max(30,Math.min(H-30,me.y)); if(owner==me){ball.x=me.x+26; ball.y=me.y+4;}}
 if(!owner){ball.x+=ballV.x; ball.y+=ballV.y; ballV.x*=0.983; ballV.y*=0.983; if(checkGoal()){} for(let p of players){if(Math.hypot(ball.x-p.x,ball.y-p.y)<32 && Math.hypot(ballV.x,ballV.y)<5){owner=p; if(my.includes(p)) active=my.indexOf(p); ballV={x:0,y:0}; break;}}}
 if(mode>=2){opp.forEach(o=>{if(owner&&my.includes(owner)){o.x+=(ball.x-o.x)*0.03; o.y+=(ball.y-o.y)*0.03;} else if(!owner && o==opp.reduce((a,b)=>Math.hypot(ball.x-a.x,ball.y-a.y)<Math.hypot(ball.x-b.x,ball.y-b.y)?a:b)){o.x+=(ball.x-o.x)*0.04; o.y+=(ball.y-o.y)*0.04;} else if(owner==o){o.x+=2.8; ball.x=o.x+16; ball.y=o.y; if(Math.random()<0.02){ballV.x=-11; ballV.y=(Math.random()-0.5)*6; owner=null;}}});}
 ctx.clearRect(0,0,W,H);
 // field lines like DLS
 ctx.fillStyle='#2ea62e'; ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=4; ctx.strokeRect(20,20,W-40,H-40);
 ctx.beginPath(); ctx.moveTo(W/2,20); ctx.lineTo(W/2,H-20); ctx.stroke();
 ctx.beginPath(); ctx.arc(W/2,H/2,90,0,Math.PI*2); ctx.stroke();
 ctx.fillStyle='#fff'; ctx.fillRect(0,H*0.35,14,H*0.2); ctx.fillRect(W-14,H*0.35,14,H*0.2);
 // crowd top
 ctx.fillStyle='#222'; ctx.fillRect(0,0,W,20);
 players.forEach(p=>p.draw());
 ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ball.x,ball.y,10,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.stroke();
 requestAnimationFrame(loop);
}
function goMenu(){run=false; clearInterval(timer); document.getElementById('menu').style.display='flex';}
</script>
</body>
</html>
