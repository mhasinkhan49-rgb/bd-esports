<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Football Penalty Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b2e13;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 650px;
            background: #198754;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            border: 4px solid #fff;
            position: relative;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        .field {
            flex-grow: 1;
            position: relative;
            background: #28a745;
            border: 2px dashed #fff;
            border-radius: 8px;
            margin: 15px 0;
            overflow: hidden;
        }
        /* Goal Post */
        .goal-post {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 80px;
            border: 4px solid #fff;
            border-bottom: none;
            background: rgba(255, 255, 255, 0.1);
        }
        /* Goalkeeper */
        .keeper {
            position: absolute;
            top: 20px;
            left: 80px;
            width: 40px;
            height: 40px;
            background: #ffc107;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: left 0.3s ease;
        }
        /* Football */
        .ball {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 35px;
            background: #fff;
            border-radius: 50%;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: bottom 0.5s ease, left 0.5s ease;
        }
        /* Controls / Buttons */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .shoot-btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #e64a19;
        }
        .message {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            height: 25px;
            color: #ffeb3b;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Scoreboard -->
    <div class="scoreboard">
        <div>স্কোর: <span id="score">0</span></div>
        <div>মিস: <span id="miss">0</span></div>
    </div>

    <!-- Message Area -->
    <div class="message" id="message">শট নেওয়ার জন্য নিচে যেকোনো দিকে ক্লিক করুন!</div>

    <!-- Football Field -->
    <div class="field">
        <div class="goal-post"></div>
        <div class="keeper" id="keeper">🧤</div>
        <div class="ball" id="ball">⚽</div>
    </div>

    <!-- Shoot Controls -->
    <div class="controls">
        <div class="shoot-btn-group">
            <button class="btn" onclick="shoot(30)">বাম দিক</button>
            <button class="btn" onclick="shoot(90)">মাঝ বরাবর</button>
            <button class="btn" onclick="shoot(150)">ডান দিক</button>
        </div>
    </div>
</div>

<script>
    let score = 0;
    let miss = 0;

    function shoot(direction) {
        let ball = document.getElementById('ball');
        let keeper = document.getElementById('keeper');
        let message = document.getElementById('message');

        // Randomly move goalkeeper
        let keeperPositions = [30, 90, 150];
        let keeperPos = keeperPositions[Math.floor(Math.random() * keeperPositions.length)];
        keeper.style.left = keeperPos + 'px';

        // Move ball to goal
        ball.style.bottom = '380px';
        ball.style.left = direction + 'px';

        setTimeout(() => {
            if (direction === keeperPos) {
                message.innerText = "গোলকিপার সেভ করেছে! মিস!";
                miss++;
                document.id('miss') // safe check
                document.getElementById('miss').innerText = miss;
            } else {
                message.innerText = "গোল! দারুণ শট!";
                score++;
                document.getElementById('score').innerText = score;
            }

            // Reset Ball and Keeper position after 1 second
            setTimeout(() => {
                ball.style.bottom = '40px';
                ball.style.left = '50%';
                message.innerText = "পরবর্তী শটের জন্য প্রস্তুত হোন!";
            }, 1000);

        }, 500);
    }
</script>

</body>
</html>
