<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARIR HUT 4K - Realistic Auction</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;overflow:hidden}
#top{position:fixed;top:0;width:100%;z-index:20;display:flex;justify-content:space-between;padding:10px;background:rgba(0,0,0,0.8);border-bottom:2px solid #facc15}
.b{font-weight:900}
#auctionStage{position:fixed;bottom:0;left:0;width:100%;height:45%;background:linear-gradient(#111827,#000);border-top:3px solid #ef4444;z-index:15;display:none;padding:10px}
.auctioneer{display:flex;gap:12px;align-items:center}
.av{width:80px;height:80px;background:#facc15;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;animation:talk 0.5s infinite}
@keyframes talk{0%{transform:scale(1)}50%{transform:scale(1.1)}}
.bidRow{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.bidCard{min-width:220px;background:#1e293b;border-radius:12px;padding:10px;border:2px solid #334155;text-align:center}
.bidCard.top{border-color:#facc15;box-shadow:0 0 15px #facc15}
.btn{background:#facc15;color:#000;padding:10px 16px;border:none;border-radius:10px;font-weight:900;margin:3px}
.btn-g{background:#22c55e;color:#fff}
#marketTalk{position:fixed;top:60px;right:10px;width:300px;background:rgba(15,23,42,0.95);border-radius:12px;padding:10px;border:2px solid #3b82f6;z-index:15;display:none}
.voiceBtn{background:#3b82f6;color:#fff;border:none;padding:8px 12px;border-radius:20px;margin:4px}
#canvas{width:100vw;height:100vh;display:block}
#joy{position:fixed;bottom:20px;left:20px;width:90px;height:90px;background:rgba(255,255,255,0.1);border-radius:50%;border:2px solid #fff3;z-index:10}
#stick{width:40px;height:40px;background:#facc15;border-radius:50%;position:absolute;left:25px;top:25px}
#hud{position:fixed;top:60px;left:10px;z-index:10;background:rgba(0,0,0,0.6);padding:8px 12px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<div id="top">
<div class="b">🚗 GARIR HUT 4K</div>
<div>৳ <span id="money">800000</span></div>
<div><span id="loc">SHOWROOM</span> | <span id="cars">0/6</span></div>
</div>

<div id="hud">
WASD / Joy হাঁটো<br>
Mouse Drag তাকাও<br>
Car কাছে গিয়ে E চাপো<br>
<span style="color:#facc15">M=Market, A=Auction, S=Showroom</span>
</div>

<div id="auctionStage">
<div class="auctioneer">
<div class="av" id="aucAv">🎤</div>
<div>
<div id="aucName" style="font-weight:900;color:#facc15;font-size:18px">Auctioneer: Loading...</div>
<div id="aucSpeech" style="font-size:14px;color:#ccc;margin-top:4px">Ladies & Gentlemen, Get Ready!</div>
<div style="margin-top:6px">⏱️ <span id="aucTimer" style="color:#ef4444;font-weight:900;font-size:22px">10</span>s | Last Price: ৳<span id="lastPrice">500000</span></div>
</div>
</div>
<div class="bidRow" id="bidRow"></div>
<div style="margin-top:8px">
<button class="btn" onclick="placeBid(5000)">+৳5K Bid</button>
<button class="btn" onclick="placeBid(10000)">+৳10K Bid</button>
<button class="btn" onclick="placeBid(25000)">+৳25K Bid</button>
<button class="btn-g" onclick="closeAuction()">❌ Auction থেকে বের হও</button>
</div>
</div>

<div id="marketTalk">
<div style="font-weight:900;color:#3b82f6">🏪 Seller কথা বলছে</div>
<div id="sellerAv" style="font-size:50px;text-align:center">🧑‍🌾</div>
<div id="sellerText" style="margin:8px 0;background:#111827;padding:8px;border-radius:8px">ভাই গাড়িটা নিবেন? ১০ হাজার টাকা দাম, একদম ফ্রেশ!</div>
<button class="voiceBtn" onclick="startListening()">🎤 Mic দিয়ে দরদাম করো</button>
<button class="voiceBtn" onclick="speakSeller()">🔊 আবার শুনো</button>
<div id="bargainBtns" style="margin-top:8px"></div>
</div>

<canvas id="canvas"></canvas>
<div id="joy"><div id="stick"></div></div>

<script type="module">
import * as THREE from 'three';
let money=800000, myCars=[];
let selectedCar=null, mode='showroom';
let auctionCars=[], auctionTime=10, auctionInt=null, currentBids={};

// --- THREE JS 4K SETUP ---
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101624);
scene.fog=new THREE.Fog(0x101624,20,90);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,500);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('canvas'),antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.2;

scene.add(new THREE.AmbientLight(0xffffff,0.5));
const sun=new THREE.DirectionalLight(0xffffff,1.5); sun.position.set(20,30,15); sun.castShadow=true; sun.shadow.mapSize.set(4096,4096); scene.add(sun);
const fill=new THREE.DirectionalLight(0x8888ff,0.4); fill.position.set(-10,10,-10); scene.add(fill);

// Showroom floor - 4K reflective
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.1, metalness:0.8}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

// Platforms
const platforms=[]; [[-12,5],[-4,5],[4,5],[12,5],[-8,-3],[8,-3]].forEach((p,i)=>{
 const base=new THREE.Mesh(new THREE.BoxGeometry(6.5,0.4,6.5), new THREE.MeshStandardMaterial({color:0x111, roughness:0.2, metalness:0.9}));
 base.position.set(p[0],0.2,p[1]); base.receiveShadow=true; scene.add(base);
 const neon=new THREE.Mesh(new THREE.BoxGeometry(6.7,0.1,6.7), new THREE.MeshStandardMaterial({color:i<3?0x00ffff:0xff00ff, emissive:i<3?0x00ffff:0xff00ff, emissiveIntensity:1.5}));
 neon.position.set(p[0],0.45,p[1]); scene.add(neon);
 platforms.push({x:p[0],z:p[1],car:null});
});

// --- DIFFERENT 3D CAR MODELS (Not same) ---
function createLambo(x,z,color=0xff3300){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.5,4.2), new THREE.MeshStandardMaterial({color, roughness:0.1, metalness:0.9})); body.position.y=0.7; body.castShadow=true; g.add(body);
 const wedge=new THREE.Mesh(new THREE.CylinderGeometry(0,0.85,1.7,3), new THREE.MeshStandardMaterial({color})); wedge.rotation.z=Math.PI/2; wedge.rotation.y=Math.PI/2; wedge.position.set(0,0.7,2); g.add(wedge);
 g.position.set(x,0,z); scene.add(g); return g;
}
function createFerrari(x,z,color=0xff0000){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.6,4), new THREE.MeshStandardMaterial({color, roughness:0.2, metalness:0.7})); body.position.y=0.75; body.castShadow=true; g.add(body);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.4,1.5), new THREE.MeshStandardMaterial({color:0x111})); roof.position.y=1.2; g.add(roof);
 g.position.set(x,0,z); scene.add(g); return g;
}
function createRolls(x,z){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(2,1,5), new THREE.MeshStandardMaterial({color:0x222222, roughness:0.3, metalness:0.2})); body.position.y=0.9; body.castShadow=true; g.add(body);
 g.position.set(x,0,z); scene.add(g); return g;
}
function createBike(x,z){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,2.2), new THREE.MeshStandardMaterial({color:0x00ff00})); body.position.y=0.8; g.add(body);
 g.position.set(x,0,z); scene.add(g); return g;
}

// Supercars pool with distinct creators
const superPool=[
 {name:"Lamborghini Aventador 2024",model:"Aventador SVJ",creator:createLambo,color:0xffa500,base:650000},
 {name:"Ferrari 488 Pista",model:"488 Pista 2023",creator:createFerrari,color:0xff0000,base:600000},
 {name:"Rolls Royce Phantom 2024",model:"Phantom VIII",creator:createRolls,color:0x111111,base:800000},
 {name:"Bugatti Chiron 2024",model:"Chiron Super Sport",creator:createLambo,color:0x0000ff,base:900000},
 {name:"Kawasaki Ninja H2R",model:"Ninja H2R 2024",creator:createBike,color:0x00ff00,base:150000},
 {name:"G-Wagon AMG 2024",model:"G63 AMG",creator:createRolls,color:0xffffff,base:500000}
];

let carMeshes=[];
// spawn initial
myCars=[{...superPool[0],buy:500000,cond:85},{...superPool[1],buy:480000,cond:80}];
myCars.forEach((c,i)=>{let m=c.creator(platforms[i].x,platforms[i].z,c.color); m.userData=c; carMeshes.push(m); platforms[i].car=c;});

// --- AUCTIONEER SYSTEM - 10 sec, 3 cars ---
function startAuctionEvent(){
 mode='auction'; document.getElementById('auctionStage').style.display='block'; document.getElementById('loc').innerText='AUCTION';
 auctionCars= [superPool[0],superPool[1],superPool[2]].map(s=>({...s,bid:500000+Math.floor(Math.random()*100000),top:"রফিক",sold:false}));
 auctionTime=10; renderAuction();
 speak(`Ladies and gentlemen! Welcome to Garir Hut Auction! Today we have three supercars! First car, ${auctionCars[0].name}, model ${auctionCars[0].model}, starting price 5 lakh taka! Who is interested?`);
 if(auctionInt) clearInterval(auctionInt);
 auctionInt=setInterval(()=>{
   auctionTime--; document.getElementById('aucTimer').innerText=auctionTime;
   // AI bidders increase
   auctionCars.forEach(c=>{if(!c.sold && Math.random()>0.4){c.bid+=Math.floor(Math.random()*20000)+5000; c.top=["জব্বার","বিদেশি বায়ার","রফিক"][Math.floor(Math.random()*3)];}});
   if(auctionTime<=0){
     // next car or end
     let current=auctionCars.find(c=>!c.sold);
     if(current){
       if(current.top==="তুমি" && money>=current.bid){money-=current.bid; myCars.push(current); let p=platforms.find(pl=>!pl.car); if(p){let m=current.creator(p.x,p.z,current.color); m.userData=current; carMeshes.push(m); p.car=current;}}
       current.sold=true;
       let next=auctionCars.find(c=>!c.sold);
       if(next){auctionTime=10; speak(`Next car! ${next.name}, model ${next.model}! Starting at ${next.bid} taka!`); renderAuction();}
       else {speak(`Auction finished! Thank you everyone!`); setTimeout(closeAuction,2000);}
     } else closeAuction();
   }
   renderAuction();
 },1000);
}

function renderAuction(){
 let h=''; auctionCars.forEach((c,i)=>{
   if(c.sold) return;
   h+=`<div class="bidCard ${c.top==='তুমি'?'top':''}"><div style="font-size:30px">🏎️</div><b>${c.name}</b><br><small>${c.model}</small><br>Bid: <b style="color:#facc15">৳${c.bid}</b><br>Top: ${c.top}</div>`;
   document.getElementById('aucName').innerText=`Now: ${c.name} - ${c.model}`;
 });
 document.getElementById('bidRow').innerHTML=h;
 document.getElementById('lastPrice').innerText=auctionCars[0]?.bid||500000;
}

function placeBid(amt){
 let cur=auctionCars.find(c=>!c.sold);
 if(!cur) return;
 if(money<cur.bid+amt) return alert('টাকা নাই');
 cur.bid+=amt; cur.top="তুমি"; renderAuction(); speak(`Bid! ${cur.bid} taka!`);
}
window.placeBid=placeBid;
window.closeAuction=()=>{mode='showroom'; document.getElementById('auctionStage').style.display='none'; document.getElementById('loc').innerText='SHOWROOM'; if(auctionInt) clearInterval(auctionInt);};

// --- MARKETPLACE VOICE BARGAIN ---
let marketSellers=[];
function spawnMarket(){
 marketSellers= [superPool[3],superPool[4],superPool[5]].map(s=>({...s,price:Math.floor(s.base*0.6),seller:["করিম চাচা","জব্বার ভাই","রহিমা আপা"][Math.floor(Math.random()*3)]}));
}
spawnMarket();

function openMarketTalk(idx){
 let s=marketSellers[idx];
 document.getElementById('marketTalk').style.display='block';
 document.getElementById('sellerText').innerText=`${s.seller}: ভাই ${s.name} টা নিবেন? ${s.price} টাকা দাম, মডেল ${s.model}, একদম ফ্রেশ! লাস্ট ${Math.floor(s.price*0.85)} টাকা দিবো!`;
 speakSeller();
 document.getElementById('bargainBtns').innerHTML=`
   <button class="voiceBtn" onclick="buyFromSeller(${idx})">💰 ${s.price} টাকায় কিনো</button>
   <button class="voiceBtn" onclick="bargainSeller(${idx},0.85)">🤝 ${Math.floor(s.price*0.85)} টাকা বলো</button>
   <button class="voiceBtn" onclick="bargainSeller(${idx},0.7)">😤 ${Math.floor(s.price*0.7)} টাকা - কমাও!</button>
 `;
}

function speakSeller(){
 let txt=document.getElementById('sellerText').innerText;
 speak(txt);
}
window.speakSeller=speakSeller;

function bargainSeller(idx,ratio){
 let s=marketSellers[idx];
 let newPrice=Math.floor(s.price*ratio);
 if(Math.random()>0.3){s.price=newPrice; document.getElementById('sellerText').innerText=`${s.seller}: আচ্ছা ঠিক আছে ভাই, ${newPrice} টাকায় নেন, লাস্ট দাম!`; speak(`${newPrice} টাকায় নেন`);}
 else {document.getElementById('sellerText').innerText=`${s.seller}: না ভাই, এই দামে হবে না! ${s.price} টাকাই লাগবে!`; speak(`না ভাই, ${s.price} টাকাই লাগবে`);}
 renderMarketTalk();
}
function buyFromSeller(idx){
 let s=marketSellers[idx];
 if(money<s.price) return alert('টাকা নাই');
 if(myCars.length>=6) return alert('Showroom Full');
 money-=s.price; myCars.push(s); marketSellers.splice(idx,1);
 let p=platforms.find(pl=>!pl.car); if(p){let m=s.creator(p.x,p.z,s.color); m.userData=s; carMeshes.push(m); p.car=s;}
 document.getElementById('marketTalk').style.display='none'; updateHUD();
 speak(`ধন্যবাদ ভাই, গাড়ি বিক্রি হলো`);
}

function renderMarketTalk(){}
window.bargainSeller=bargainSeller; window.buyFromSeller=buyFromSeller;

// Voice Recognition for bargaining
let recognition=null;
window.startListening=()=>{
 if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){alert('Mic support নাই, Chrome ব্যবহার করো');return;}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 recognition=new SR(); recognition.lang='bn-BD'; recognition.start();
 recognition.onresult=(e)=>{
   let text=e.results[0][0].transcript.toLowerCase();
   document.getElementById('sellerText').innerText=`তুমি বলছো: "${text}"`;
   // parse price
   let num=text.match(/\d+/); if(num){let price=parseInt(num[0])*1000; let s=marketSellers[0]; if(price < s.price*0.6){speak(`না ভাই, এত কমে হবে না, ${s.price} টাকা লাগবে`);} else {s.price=price; speak(`ঠিক আছে ${price} টাকায় নেন`); renderMarketTalk();}}
   else if(text.includes('কম')||text.includes('কমান')){bargainSeller(0,0.85);}
 };
};

function speak(text){
 if('speechSynthesis' in window){
   speechSynthesis.cancel();
   let u=new SpeechSynthesisUtterance(text); u.lang='bn-BD'; u.rate=0.9; 
   let v=speechSynthesis.getVoices().find(v=>v.lang.includes('bn')); if(v) u.voice=v;
   speechSynthesis.speak(u);
 }
}

// Controls
camera.position.set(0,1.7,12); let yaw=0,pitch=0,keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key==='a'||e.key==='A') startAuctionEvent();
 if(e.key==='m'||e.key==='M'){mode='market'; document.getElementById('loc').innerText='MARKET'; openMarketTalk(0);}
 if(e.key==='s'||e.key==='S'){mode='showroom'; document.getElementById('loc').innerText='SHOWROOM'; document.getElementById('marketTalk').style.display='none'; document.getElementById('auctionStage').style.display='none';}
 if(e.key==='e'||e.key==='E'){// interact near car
   let ray=new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(0,0),camera);
   let hits=ray.intersectObjects(carMeshes,true); if(hits.length){let root=hits[0].object.parent; while(root.parent && root.parent.type!='Scene') root=root.parent; selectedCar=root.userData; alert(`Selected: ${selectedCar.name} - Press M for market talk`);}
 }
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let drag=false,lx=0,ly=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag) return; yaw-=(e.clientX-lx)*0.003; pitch-=(e.clientY-ly)*0.003; pitch=Math.max(-1.2,Math.min(1.2,pitch)); lx=e.clientX;ly=e.clientY;});
let jx=0,jy=0; const joy=document.getElementById('joy'), stick=document.getElementById('stick');
joy.addEventListener('touchmove',e=>{let r=joy.getBoundingClientRect();let t=e.touches[0];let x=t.clientX-(r.left+45),y=t.clientY-(r.top+45);let d=Math.hypot(x,y);if(d>35){x=x/d*35;y=y/d*35} stick.style.transform=`translate(${x}px,${y}px)`; jx=x/35;jy=y/35;});
joy.addEventListener('touchend',()=>{stick.style.transform='';jx=0;jy=0;});

function update(){
 let f=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
 let r=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
 let sp=0.1;
 if(keys['w']||jy<-0.2) camera.position.addScaledVector(f,sp);
 if(keys['s']||jy>0.2) camera.position.addScaledVector(f,-sp);
 if(keys['a']||jx<-0.2) camera.position.addScaledVector(r,-sp);
 if(keys['d']||jx>0.2) camera.position.addScaledVector(r,sp);
 camera.rotation.order='YXZ'; camera.rotation.y=yaw; camera.rotation.x=pitch;
}
function updateHUD(){document.getElementById('money').innerText=money; document.getElementById('cars').innerText=myCars.length+'/6';}
function loop(){requestAnimationFrame(loop); update(); renderer.render(scene,camera); updateHUD();}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});

// Auto staff repair
setInterval(()=>{
 if(myCars.length){let c=myCars.find(x=>x.cond<90); if(c) c.cond=Math.min(100,c.cond+1);}
},2000);
</script>
</body>
</html>
