<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro FC Soccer 2026</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 440px;
            height: 100vh;
            max-height: 800px;
            background-color: #1b5e20;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #2e7d32;
            box-shadow: 0 0 30px rgba(0,255,100,0.2);
        }
        /* Top Header / Scoreboard */
        .header {
            background: linear-gradient(180deg, rgba(10,15,25,0.95) 0%, rgba(10,15,25,0.7) 100%);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .scoreboard {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,215,0,0.3);
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .team-score { margin: 0 6px; color: #00e676; font-size: 16px; }
        .timer { color: #ffeb3b; font-size: 13px; margin-left: 12px; font-family: monospace; }
        .tokens-display {
            background: rgba(255,193,7,0.15);
            border: 1px solid #ffc107;
            color: #ffc107;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        /* Pitch & Audience */
        .stadium {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2e7d32;
            overflow: hidden;
        }
        .audience-side {
            position: absolute;
            width: 100%;
            height: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #113813;
            z-index: 2;
        }
        .audience-side.top { top: 0; }
        .audience-side.bottom { bottom: 0; }
        .spectator {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: cheer 0.6s infinite alternate ease-in-out;
        }
        @keyframes cheer {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }
        canvas { background-color: #388e3c; }

        /* Controls Section */
        .controls-container {
            height: 170px;
            background: rgba(10, 14, 23, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            z-index: 10;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .d-pad { position: relative; width: 120px; height: 120px; }
        .d-btn {
            position: absolute;
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .d-btn:active { background: rgba(0, 230, 118, 0.4); border-color: #00e676; }
        .d-up { top: 0; left: 41px; }
        .d-down { bottom: 0; left: 41px; }
        .d-left { top: 41px; left: 0; }
        .d-right { top: 41px; right: 0; }

        .action-btns { display: flex; gap: 12px; align-items: center; }
        .btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
            color: white;
            font-weight: 800;
            font-size: 10px;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.9); }
        .btn-pass { background: linear-gradient(135deg, #1e88e5, #1565c0); }
        .btn-sprint { background: linear-gradient(135deg, #43a047, #2e7d32); }
        .btn-shoot { background: linear-gradient(135deg, #e53935, #c62828); }

        .shop-btn {
            position: absolute;
            top: 60px;
            right: 12px;
            background: linear-gradient(135deg, #ffb300, #ff8f00);
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 15, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }
        .character-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0;
            width: 85%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .buy-btn {
            background: linear-gradient(135deg, #ffc107, #ff8f00);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
        }
        .buy-btn:disabled { background: #444; color: #888; }
        .close-btn {
            margin-top: 15px;
            background: #d32f2f;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <div class="scoreboard">
            <span>YOU</span> <span id="score-user" class="team-score">0</span>
            -
            <span id="score-bot" class="team-score">0</span> <span>BOT</span>
            <span id="timer" class="timer">01:00</span>
        </div>
        <div class="tokens-display">🪙 <span id="token-count">0</span></div>
    </div>

    <button class="shop-btn" onclick="openShop()">🛒 ক্যারেক্টার শপ</button>

    <div class="stadium">
        <div class="audience-side top" id="audience-top"></div>
        <canvas id="fieldCanvas" width="360" height="480"></canvas>
        <div class="audience-side bottom" id="audience-bottom"></div>
    </div>

    <div class="controls-container">
        <div class="d-pad">
            <div class="d-btn d-up" id="btn-up">▲</div>
            <div class="d-btn d-left" id="btn-left">◀</div>
            <div class="d-btn d-right" id="btn-right">▶</div>
            <div class="d-btn d-down" id="btn-down">▼</div>
        </div>
        <div class="action-btns">
            <div class="btn btn-pass" id="btn-pass">PASS</div>
            <div class="btn btn-sprint" id="btn-sprint">SPRINT</div>
            <div class="btn btn-shoot" id="btn-shoot">SHOOT</div>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="overlay hidden">
        <h2 style="color: #ffc107; margin-bottom: 5px;">প্রফেশনাল ক্যারেক্টার শপ</h2>
        <p style="font-size: 12px; color: #aaa; margin-bottom: 15px;">টোকেন দিয়ে নতুন ক্যারেক্টার সিলেক্ট করুন</p>
        
        <div class="character-card">
            <div style="text-align: left;">
                <strong style="color: #ff4081; font-size: 16px;">লি (Lee)</strong>
                <div style="font-size: 11px; color:#4fc3f7;">স্পিড ড্রিবলার (+৩৫% গতি)</div>
            </div>
            <button class="buy-btn" id="buy-lee" onclick="buyCharacter('Lee', 10000)">১০,০০০ 🪙</button>
        </div>

        <div class="character-card">
            <div style="text-align: left;">
                <strong style="color: #00e676; font-size: 16px;">আফা (Afa)</strong>
                <div style="font-size: 11px; color:#4fc3f7;">পাওয়ার স্ট্রাইকার (+৫০% শট)</div>
            </div>
            <button class="buy-btn" id="buy-afa" onclick="buyCharacter('Afa', 10000)">১০,০০০ 🪙</button>
        </div>

        <div class="character-card">
            <div style="text-align: left;">
                <strong style="color: #00b0ff; font-size: 16px;">ফিফা (Fifa)</strong>
                <div style="font-size: 11px; color:#4fc3f7;">অল-রাউন্ড মাস্টার (ম্যাক্স স্ট্যাটস)</div>
            </div>
            <button class="buy-btn" id="buy-fifa" onclick="buyCharacter('Fifa', 10000)">১০,০০০ 🪙</button>
        </div>

        <button class="close-btn" onclick="closeShop()">বন্ধ করুন</button>
    </div>

    <!-- Game End Modal -->
    <div id="end-modal" class="overlay hidden">
        <h1 id="match-result" style="color: #00e676;">ম্যাচ সমাপ্ত!</h1>
        <p id="reward-text" style="margin: 15px 0; color: #ffc107; font-size: 18px; font-weight: bold;"></p>
        <button class="buy-btn" style="padding: 12px 28px; font-size: 16px;" onclick="restartMatch()">আবার খেলুন</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('fieldCanvas');
    const ctx = canvas.getContext('2d');

    let tokens = parseInt(localStorage.getItem('game_tokens') || '0');
    let unlockedChars = JSON.parse(localStorage.getItem('unlocked_chars') || '[]');
    let selectedChar = localStorage.getItem('selected_char') || 'Normal';

    let userScore = 0;
    let botScore = 0;
    let matchTime = 60;
    let gameInterval = null;
    let timerInterval = null;
    let isGameOver = false;

    const keys = { up: false, down: false, left: false, right: false, sprint: false };
    document.getElementById('token-count').innerText = tokens;

    function setupAudience() {
        const topAud = document.getElementById('audience-top');
        const botAud = document.getElementById('audience-bottom');
        const colors = ['#f44336', '#e91e63', '#9c27b0', '#2196f3', '#ffeb3b', '#ff9800'];
        for(let i=0; i<25; i++){
            let d1 = document.createElement('div');
            d1.className = 'spectator';
            d1.style.background = colors[Math.floor(Math.random()*colors.length)];
            topAud.appendChild(d1.cloneNode(true));
            botAud.appendChild(d1);
        }
    }

    class Ball {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.vx = 0; this.vy = 0;
            this.radius = 5;
            this.friction = 0.97;
            this.owner = null;
        }
        update() {
            if (this.owner) {
                this.x = this.owner.x + Math.cos(this.owner.angle) * 11;
                this.y = this.owner.y + Math.sin(this.owner.angle) * 11;
                this.vx = 0; this.vy = 0;
            } else {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= this.friction;
                this.vy *= this.friction;

                if(this.x < 12) { this.x = 12; this.vx *= -0.6; }
                if(this.x > canvas.width - 12) { this.x = canvas.width - 12; this.vx *= -0.6; }
                
                // Goal Detection
                if(this.y < 12) {
                    if(this.x > 120 && this.x < 240) {
                        userScore++;
                        document.getElementById('score-user').innerText = userScore;
                        resetPositions();
                    } else { this.y = 12; this.vy *= -0.6; }
                }
                if(this.y > canvas.height - 12) {
                    if(this.x > 120 && this.x < 240) {
                        botScore++;
                        document.getElementById('score-bot').innerText = botScore;
                        resetPositions();
                    } else { this.y = canvas.height - 12; this.vy *= -0.6; }
                }
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.stroke();
            ctx.closePath();
        }
    }

    class Player {
        constructor(x, y, team, num, isGK = false, isMain = false) {
            this.startX = x; this.startY = y;
            this.x = x; this.y = y;
            this.team = team; 
            this.num = num;
            this.isGK = isGK;
            this.isMain = isMain;
            this.radius = 10;
            this.speed = isGK ? 2.2 : 2.6; // Pro aggressive speed
            this.angle = 0;
        }

        update() {
            let speedMult = 1;
            if(this.isMain) {
                if(selectedChar === 'Lee') speedMult = 1.35;
                if(selectedChar === 'Fifa') speedMult = 1.45;
            }

            if (this.isMain) {
                let dx = 0, dy = 0;
                if (keys.up) dy -= 1;
                if (keys.down) dy += 1;
                if (keys.left) dx -= 1;
                if (keys.right) dx += 1;

                if (dx !== 0 || dy !== 0) {
                    this.angle = Math.atan2(dy, dx);
                    let curSpeed = this.speed * speedMult * (keys.sprint ? 1.6 : 1);
                    this.x += Math.cos(this.angle) * curSpeed;
                    this.y += Math.sin(this.angle) * curSpeed;
                }
            } else if (this.isGK) {
                // Smart Pro GK AI
                this.x += (ball.x - this.x) * 0.1;
                this.x = Math.max(130, Math.min(230, this.x));
            } else {
                // Hard Tackling & Passing Bot AI
                let target = ball;
                let dist = Math.hypot(target.x - this.x, target.y - this.y);
                
                if (this.team === 'bot') {
                    if (ball.owner === this) {
                        let goalX = 180, goalY = 10;
                        this.angle = Math.atan2(goalY - this.y, goalX - this.x);
                        this.x += Math.cos(this.angle) * (this.speed * 1.1);
                        this.y += Math.sin(this.angle) * (this.speed * 1.1);

                        // Professional Shoot Opportunity
                        if(this.y < 140) {
                            shootBall(this, 0, -1);
                        }
                    } else {
                        // High Pressing AI
                        this.angle = Math.atan2(target.y - this.y, target.x - this.x);
                        this.x += Math.cos(this.angle) * (this.speed * 1.1);
                        this.y += Math.sin(this.angle) * (this.speed * 1.1);
                    }
                } else {
                    if (!this.isMain && ball.owner !== this) {
                        this.y += (this.startY - this.y) * 0.04;
                    }
                }
            }

            this.x = Math.max(14, Math.min(canvas.width - 14, this.x));
            this.y = Math.max(14, Math.min(canvas.height - 14, this.y));

            // Tackle Collision Check
            let distToBall = Math.hypot(ball.x - this.x, ball.y - this.y);
            if (distToBall < this.radius + ball.radius + 2) {
                ball.owner = this;
            }
        }

        draw() {
            // Player Shadow
            ctx.beginPath();
            ctx.arc(this.x + 2, this.y + 3, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fill();

            // Player Body
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.isGK ? '#ff9800' : (this.team === 'user' ? '#1e88e5' : '#e53935');
            ctx.fill();
            ctx.strokeStyle = this.isMain ? '#ffeb3b' : '#ffffff';
            ctx.lineWidth = this.isMain ? 3 : 1.5;
            ctx.stroke();

            // Jersey Number
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.num, this.x, this.y);

            // Active Player Indicator Triangle
            if(this.isMain) {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - 15);
                ctx.lineTo(this.x - 5, this.y - 22);
                ctx.lineTo(this.x + 5, this.y - 22);
                ctx.fillStyle = '#ffeb3b';
                ctx.fill();
            }
        }
    }

    let players = [];
    let ball = new Ball(canvas.width / 2, canvas.height / 2);

    function initPlayers() {
        players = [
            // User Team (Blue - 4 Players)
            new Player(180, 40, 'user', '1', true),               
            new Player(180, 320, 'user', '10', false, true),       
            new Player(90, 260, 'user', '7', false),             
            new Player(270, 260, 'user', '9', false),             

            // Bot Team (Red - 4 Players)
            new Player(180, 440, 'bot', '1', true),               
            new Player(180, 160, 'bot', '10', false),              
            new Player(90, 200, 'bot', '11', false),              
            new Player(270, 200, 'bot', '8', false)               
        ];
    }

    function resetPositions() {
        ball.owner = null;
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.vx = 0; ball.vy = 0;
        players.forEach(p => { p.x = p.startX; p.y = p.startY; });
    }

    function passBall() {
        let main = players.find(p => p.isMain);
        if (ball.owner === main) {
            let teammates = players.filter(p => p.team === 'user' && !p.isMain);
            let closest = teammates[0];
            let minDist = 999;
            teammates.forEach(t => {
                let d = Math.hypot(t.x - main.x, t.y - main.y);
                if (d < minDist) { minDist = d; closest = t; }
            });
            ball.owner = null;
            let angle = Math.atan2(closest.y - main.y, closest.x - main.x);
            ball.vx = Math.cos(angle) * 8.5;
            ball.vy = Math.sin(angle) * 8.5;
        }
    }

    function shootBall(shooter = null, dirX = 0, dirY = -1) {
        let p = shooter || players.find(p => p.isMain);
        if (ball.owner === p) {
            ball.owner = null;
            let power = 11;
            if(p.isMain && (selectedChar === 'Afa' || selectedChar === 'Fifa')) power = 15;

            if(!shooter) {
                let angle = Math.atan2(0 - p.y, 180 - p.x);
                ball.vx = Math.cos(angle) *
