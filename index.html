<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Soccer Dribble & Match Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-wrapper {
            position: relative;
            width: 800px;
            height: 500px;
            background: #2e7d32;
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        /* Football Pitch Markings */
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
        }
        .center-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: rgba(255,255,255,0.5);
        }
        .goal-box {
            position: absolute;
            right: 0;
            top: 150px;
            width: 80px;
            height: 200px;
            border: 2px solid rgba(255,255,255,0.8);
            border-right: none;
            background: rgba(255,255,255,0.1);
        }
        
        /* Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        /* Score & UI */
        .scoreboard {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            z-index: 20;
            border: 1px solid #ffca28;
        }

        /* On-Screen Mobile Controls */
        .controls-container {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 20;
            pointer-events: none;
        }
        .dpad, .action-btns {
            pointer-events: auto;
            display: flex;
            gap: 10px;
        }
        .dpad-btn, .action-btn {
            width: 55px;
            height: 55px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            border-radius: 50%;
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .dpad-btn:active, .action-btn:active {
            background: #ffca28;
            color: #000;
        }
        .action-btn.shoot { background: rgba(229, 57, 53, 0.8); }
        .action-btn.pass { background: rgba(30, 136, 229, 0.8); }
        .action-btn.sprint { background: rgba(76, 175, 80, 0.8); }

        .instructions {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 20;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="scoreboard">YOU <span id="score">0</span> - 0 BOT</div>
    <div class="instructions">কীবোর্ড: Arrow / WASD = মুভمنٹ, Space = শুট, X = পাস</div>
    
    <div class="center-line"></div>
    <div class="center-circle"></div>
    <div class="goal-box"></div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- Mobile Screen Controls -->
    <div class="controls-container">
        <!-- Directional Controls -->
        <div style="display: grid; grid-template-columns: repeat(3, 45px); gap: 5px;" class="dpad">
            <div></div>
            <div class="dpad-btn" ontouchstart="keys['ArrowUp']=true" ontouchend="keys['ArrowUp']=false">⬆️</div>
            <div></div>
            <div class="dpad-btn" ontouchstart="keys['ArrowLeft']=true" ontouchend="keys['ArrowLeft']=false">⬅️</div>
            <div class="dpad-btn" ontouchstart="keys['ArrowDown']=true" ontouchend="keys['ArrowDown']=false">⬇️</div>
            <div class="dpad-btn" ontouchstart="keys['ArrowRight']=true" ontouchend="keys['ArrowRight']=false">➡️</div>
        </div>

        <!-- Action Buttons (Shoot, Pass, Sprint) -->
        <div class="action-btns">
            <div class="action-btn pass" onclick="passBall()">PASS</div>
            <div class="action-btn sprint" onclick="toggleSprint()">SPRINT</div>
            <div class="action-btn shoot" onclick="shootBall()">SHOOT</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let keys = {};

// Player (You)
const player = {
    x: 150,
    y: 250,
    radius: 15,
    color: '#2196F3',
    speed: 3,
    baseSpeed: 3,
    hasBall: true
};

// Defender (Opponent)
const defender = {
    x: 500,
    y: 250,
    radius: 15,
    color: '#E53935',
    speed: 1.8
};

// Ball
const ball = {
    x: player.x + 15,
    y: player.y,
    radius: 7,
    color: '#FFF',
    vx: 0,
    vy: 0
};

// Controls tracking
window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if(e.key === ' ') shootBall();
    if(e.key === 'x' || e.key === 'X') passBall();
});
window.addEventListener('keyup', e => keys[e.key] = false);

function toggleSprint() {
    player.speed = player.speed === player.baseSpeed ? 5.5 : player.baseSpeed;
}

function shootBall() {
    if (player.hasBall) {
        player.hasBall = false;
        ball.vx = 12; // Power Shoot towards Goal
        ball.vy = (Math.random() - 0.5) * 4;
    }
}

function passBall() {
    if (player.hasBall) {
        player.hasBall = false;
        ball.vx = 7;
        ball.vy = 2;
    }
}

function update() {
    // Player Movement (Dribble Controls)
    if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;

    // Boundaries
    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    // Ball movement with Player
    if (player.hasBall) {
        ball.x = player.x + 12;
        ball.y = player.y;
    } else {
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx *= 0.96; // Friction
        ball.vy *= 0.96;
    }

    // AI Defender Logic (Follows Player & Tackles)
    let dx = player.x - defender.x;
    let dy = player.y - defender.y;
    let dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 5) {
        defender.x += (dx / dist) * defender.speed;
        defender.y += (dy / dist) * defender.speed;
    }

    // Tackle Collision (Opponent steals the ball)
    if (dist < player.radius + defender.radius && player.hasBall) {
        player.hasBall = false;
        ball.vx = -5; // Kick ball back
        ball.vy = (Math.random() - 0.5) * 6;
    }

    // Regain Ball
    let ballDist = Math.hypot(player.x - ball.x, player.y - ball.y);
    if (ballDist < player.radius + ball.radius && !player.hasBall && Math.abs(ball.vx) < 3) {
        player.hasBall = true;
    }

    // Goal Detection (Right Goal Area)
    if (ball.x > 780 && ball.y > 150 && ball.y < 350) {
        score++;
        document.getElementById('score').innerText = score;
        resetPositions();
    }
}

function resetPositions() {
    player.x = 150;
    player.y = 250;
    defender.x = 550;
    defender.y = 250;
    player.hasBall = true;
    ball.vx = 0;
    ball.vy = 0;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Player
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.stroke();

    // Draw Defender
    ctx.beginPath();
    ctx.arc(defender.x, defender.y, defender.radius, 0, Math.PI * 2);
    ctx.fillStyle = defender.color;
    ctx.fill();
    ctx.stroke();

    // Draw Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = ball.color;
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.stroke();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
