<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yes, Your Majesty - Royal Court Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a1a;
            color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 750px;
            background: #2b2b2b;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            border: 2px solid #d4af37;
            position: relative;
        }
        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: #1f1f1f;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .stat-box {
            text-align: center;
            font-size: 12px;
        }
        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #d4af37;
        }
        /* Character & Dialog Area */
        .scene-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
        }
        .character-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #444;
            border: 3px solid #d4af37;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .dialog-box {
            background: #383838;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #555;
            width: 100%;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 1.4;
        }
        /* Choice Buttons */
        .choices-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }
        .choice-btn {
            background: #333;
            color: #fff;
            border: 1px solid #d4af37;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            text-align: left;
        }
        .choice-btn:hover {
            background: #d4af37;
            color: #111;
            font-weight: bold;
        }
        /* Game Over Modal */
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
        }
        .game-over h1 {
            color: #ff4d4d;
            margin-bottom: 15px;
        }
        .restart-btn {
            background: #d4af37;
            color: #111;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Stats Header -->
    <div class="stats-bar">
        <div class="stat-box">💰 সোনা<div class="stat-value" id="stat-gold">50</div></div>
        <div class="stat-box">👥 জনবল<div class="stat-value" id="stat-people">50</div></div>
        <div class="stat-box">⚔️ সেনা<div class="stat-value" id="stat-army">50</div></div>
        <div class="stat-box">🕊️ শান্তি<div class="stat-value" id="stat-peace">50</div></div>
    </div>

    <!-- Scene & Dialog -->
    <div class="scene-area">
        <div class="character-img" id="char-avatar">👑</div>
        <div class="dialog-box" id="dialog-text">রাজদরবারে স্বাগতম, মহামান্য রাজা! আপনার রাজ্য পরিচালনা শুরু করুন।</div>
    </div>

    <!-- Choices -->
    <div class="choices-area" id="choices-container">
        <button class="choice-btn" onclick="startGame()">গেম শুরু করুন</button>
    </div>

    <!-- Game Over Screen -->
    <div class="game-over" id="game-over-screen">
        <h1>রাজ্যের পতন ঘটেছে!</h1>
        <p id="game-over-reason">আপনার ভুল সিদ্ধান্তের কারণে রাজ্য ধ্বংস হয়ে গেছে।</p>
        <button class="restart-btn" onclick="restartGame()">পুনরায় চেষ্টা করুন</button>
    </div>
</div>

<script>
    // Game Stats
    let stats = {
        gold: 50,
        people: 50,
        army: 50,
        peace: 50
    };

    // Story Scenarios (Yes/No or Choice-based Events)
    const scenarios = [
        {
            avatar: "🧙‍♂️",
            text: "রাজ্যজুড়ে খরা চলছে। জাদুকর বলছে যাদুর বলে বৃষ্টি নামাতে প্রচুর সোনা লাগবে। জাদুকরের প্রস্তাবে রাজি হবেন?",
            choices: [
                { text: "হ্যাঁ, সোনা দিয়ে বৃষ্টি নামাও।", effect: { gold: -20, people: +15, peace: +10 } },
                { text: "না, প্রকৃতির ওপর ভরসা রাখুন।", effect: { gold: +10, people: -15, peace: -10 } }
            ]
        },
        {
            avatar: "🛡️",
            text: "সেনাপ্রধান সীমান্ত সুরক্ষার জন্য নতুন অস্ত্র কেনার অনুমতি চাচ্ছেন।",
            choices: [
                { text: "অনুমতি দিলাম, অস্ত্র কিনুন।", effect: { gold: -25, army: +20, peace: +5 } },
                { text: "দরকার নেই, কোষাগার বাঁচান।", effect: { gold: +10, army: -15, peace: -5 } }
            ]
        },
        {
            avatar: "🌾",
            text: "কৃষকরা অতিরিক্ত কর মওকুফের আবেদন নিয়ে এসেছে। কী করবেন?",
            choices: [
                { text: "কর মওকুফ করে দিন।", effect: { gold: -15, people: +20, peace: +15 } },
                { text: "না, কর কমানো যাবে না।", effect: { gold: +15, people: -20, peace: -10 } }
            ]
        },
        {
            avatar: "🦹‍♂️",
            text: "এক চোর ধরা পড়েছে। সে রাজাকে প্রচুর ঘুস দিতে চাচ্ছে তাকে ছেড়ে দেওয়ার জন্য।",
            choices: [
                { text: "ঘুস নিয়ে তাকে ছেড়ে দাও।", effect: { gold: +30, people: -15, peace: -15 } },
                { text: "তাকে কঠোর শাস্তি দাও!", effect: { gold: -5, people: +15, peace: +10 } }
            ]
        },
        {
            avatar: "👑",
            text: "প্রতিবেশী রাজ্য থেকে মৈত্রী চুক্তির প্রস্তাব এসেছে। আপনি কি গ্রহণ করবেন?",
            choices: [
                { text: "হ্যাঁ, শান্তি বজায় রাখা ভালো।", effect: { army: -10, peace: +20, gold: -10 } },
                { text: "না, আমরা একাই শক্তিশালী।", effect: { army: +15, peace: -10, gold: +5 } }
            ]
        }
    ];

    let currentScenarioIndex = 0;

    function updateUI() {
        document.getElementById('stat-gold').innerText = stats.gold;
        document.getElementById('stat-people').innerText = stats.people;
        document.getElementById('stat-army').innerText = stats.army;
        document.getElementById('stat-peace').innerText = stats.peace;

        // Check Game Over Conditions
        if (stats.gold <= 0 || stats.people <= 0 || stats.army <= 0 || stats.peace <= 0) {
            triggerGameOver("আপনার রাজ্যের যেকোনো একটি সম্পদ শূন্যে পৌঁছে গেছে!");
        } else if (stats.gold >= 100 || stats.people >= 100 || stats.army >= 100 || stats.peace >= 100) {
            triggerGameOver("অভিনন্দন! আপনার রাজ্য চরম সমৃদ্ধি ও শক্তিতে ভরে উঠেছে এবং আপনি জয়ী হয়েছেন!");
        }
    }

    function loadScenario() {
        if (currentScenarioIndex >= scenarios.length) {
            currentScenarioIndex = 0; // Loop scenarios or end game
        }

        let scenario = scenarios[currentScenarioIndex];
        document.getElementById('char-avatar').innerText = scenario.avatar;
        document.getElementById('dialog-text').innerText = scenario.text;

        let choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = '';

        scenario.choices.forEach((choice, index) => {
            let btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choice.text;
            btn.onclick = () => makeChoice(choice.effect);
            choicesContainer.appendChild(btn);
        });
    }

    function makeChoice(effect) {
        stats.gold += effect.gold || 0;
        stats.people += effect.people || 0;
        stats.army += effect.army || 0;
        stats.peace += effect.peace || 0;

        // Keep stats within 0 to 100 range
        for (let key in stats) {
            if (stats[key] > 100) stats[key] = 100;
            if (stats[key] < 0) stats[key] = 0;
        }

        updateUI();
        currentScenarioIndex++;
        loadScenario();
    }

    function startGame() {
        stats = { gold: 50, people: 50, army: 50, peace: 50 };
        currentScenarioIndex = 0;
        document.getElementById('game-over-screen').style.display = 'none';
        updateUI();
        loadScenario();
    }

    function triggerGameOver(reason) {
        document.getElementById('game-over-reason').innerText = reason;
        document.getElementById('game-over-screen').style.display = 'flex';
    }
</script>

</body>
</html>
