<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>FC BD 27 - VOICE MATCH</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;touch-action:none;font-family:Arial}
body{background:#000;color:#fff;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;height:44px;background:#000;display:flex;justify-content:space-between;align-items:center;padding:0 8px;z-index:100;border-bottom:2px solid #2ecc71;font-size:10px;font-weight:bold}
#field{position:fixed;top:44px;left:0;right:0;bottom:100px;background:#1e7a1e}
#cv{width:100%;height:100%;display:block}
.controls{position:fixed;bottom:0;left:0;right:0;height:100px;background:#111;display:flex;justify-content:space-between;align-items:center;padding:0 8px;z-index:100}
.joy{width:80px;height:80px;background:#333;border-radius:50%;border:2px solid #666;position:relative}
.stick{width:36px;height:36px;background:#fff;border-radius:50%;position:absolute;left:22px;top:22px}
.btn{width:52px;height:52px;border-radius:50%;background:#222;border:2px solid #fff;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:9px}
.screen{position:fixed;inset:0;background:#000;z-index:200;padding:12px;overflow:auto}
.card{background:#122212;border:2px solid #2ecc71;border-radius:14px;padding:12px;margin:8px 0}
.b{width:100%;padding:14px;margin:6px 0;background:#2ecc71;color:#000;border:none;border-radius:12px;font-weight:bold}
.bB{background:#3498db;color:#fff} .bY{background:#f1c40f;color:#000} .bG{background:#333;color:#fff} .bR{background:#e74c3c;color:#fff}
input{width:100%;padding:14px;background:#222;color:#fff;border:2px solid #2ecc71;border-radius:10px;margin:8px 0;font-size:18px;text-align:center;letter-spacing:3px;font-weight:bold}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000;border:2px solid #ff0;padding:14px 22px;border-radius:12px;z-index:500;display:none;font-weight:bold;text-align:center}
.status{padding:10px;background:#111;border-radius:8px;text-align:center;font-size:12px;margin:8px 0;border:1px solid #2ecc71;color:#2ecc71}
</style>
</head>
<body>
<div class="top"><span id="score">BRA 0-0 ARS</span><span id="coin">💰 1000</span><span id="net">OFFLINE</span><span id="voiceStat">🎤 OFF</span><span id="time">00:00</span></div>
<div id="field"><canvas id="cv"></canvas><div id="msg"></div><audio id="remoteAudio" autoplay playsinline></audio></div>
<div class="controls">
<div class="joy" id="joy"><div class="stick" id="stick"></div></div>
<div style="display:flex;gap:4px"><div class="btn" id="tBtn">TACKLE</div><div class="btn" id="sBtn" style="border-color:red">SHOOT</div><div class="btn" id="pBtn" style="border-color:#2ecc71">PASS</div></div>
<button onclick="showMenu()" style="padding:6px;background:#333;color:#fff;border-radius:6px;font-size:10px">MENU</button>
</div>

<div id="menuScreen" class="screen">
<div class="card" style="text-align:center">
<div style="font-size:26px">🌐🎤 <b style="color:#2ecc71">MATCH + VOICE<br>URI SYSTEM</b></div>
<p style="font-size:12px;color:#aaa">ম্যাচের ভিতরে কথা বলে খেলা ✅</p>
<div>Coin: <b id="mCoin" style="color:#f1c40f">1000</b></div>
<button class="b bB" onclick="openMulti()">🌐🎤 MATCH + VOICE - URI SYSTEM</button>
<button class="b" onclick="startOffline()">▶️ OFFLINE MATCH - 2 GK</button>
<button class="b bG" onclick="alert('GK: Martinez 1000, Romero 1000, Mac Allister 1000')">🛒 SHOP</button>
<button class="b" style="background:linear-gradient(90deg,#f1c40f,#e67e22)" onclick="downloadGame()">📥 DOWNLOAD</button>
</div>
</div>

<div id="multiScreen" class="screen" style="display:none">
<div class="card" style="text-align:center">
<h3>🌐🎤 MATCH VOICE SYSTEM</h3>
<div class="status" id="multiStatus">OFFLINE - Room বানাও</div>
<button class="b bY" id="voiceBtn" onclick="toggleVoice()">🎤 VOICE ON - Mic চালু</button>
<div id="voiceInfo" style="font-size:11px;color:#f1c40f;margin:6px 0">Voice ON করলে ম্যাচের ভিতরে কথা বলতে পারবা</div>
<button class="b bB" onclick="createRoom()">📤 CREATE MATCH ROOM</button>
<input id="joinCode" placeholder="BRA-1234" maxlength="8">
<button class="b bG" onclick="joinRoom()">📥 JOIN MATCH ROOM</button>
<div id="roomBox" style="display:none" class="card" style="border-color:#f1c40f">
<div id="myCode" style="font-size:32px;font-weight:bold;letter-spacing:4px;color:#2ecc71;margin:10px 0">---</div>
<button class="b" style="background:#25D366;color:#fff" onclick="shareCode()">📲 WhatsApp এ Code পাঠাও</button>
<div class="status" id="waitStatus">অপেক্ষা...</div>
</div>
<button class="b bG" onclick="showMenu()">← BACK</button>
<button class="b bR" style="display:none" id="startBtn" onclick="startMulti(true)">▶️ START VOICE MATCH</button>
</div>
</div>

<script>
let COIN=1000; function upd(){document.getElementById('coin').innerText='💰 '+COIN; document.getElementById('mCoin').innerText=COIN;} upd();
function downloadGame(){let h=document.documentElement.outerHTML; let b=new Blob([h],{type:'text/html'}); let u=URL.createObjectURL(b); let a=document.createElement('a'); a.href=u; a.download='Match-Voice-URI-Final.html'; a.click();}
function hideAll(){document.getElementById('menuScreen').style.display='none'; document.getElementById('multiScreen').style.display='none';}
function showMenu(){hideAll(); document.getElementById('menuScreen').style.display='block'; run=false; clearInterval(timer);}
function openMulti(){hideAll(); document.getElementById('multiScreen').style.display='block';}
function showMsg(t,c){let m=document.getElementById('msg'); m.innerText=t; m.style.borderColor=c||'#ff0'; m.style.display='block'; setTimeout(()=>m.style.display='none',1500);}

// VOICE SYSTEM
let peer=null, conn=null, call=null, localStream=null, myId=null, isHost=false, isMulti=false, voiceOn=false;
async function toggleVoice(){
let btn=document.getElementById('voiceBtn'), vs=document.getElementById('voiceStat');
if(!voiceOn){
try{
localStream=await navigator.mediaDevices.getUserMedia({audio:true});
voiceOn=true; btn.innerText='🔴 VOICE OFF'; btn.style.background='#e74c3c'; btn.style.color='#fff';
vs.innerText='🎤 ON'; vs.style.color='#2ecc71'; showMsg('🎤 Voice ON!','green');
if(conn && isHost){let c=peer.call(conn.peer, localStream); c.on('stream',s=>{document.getElementById('remoteAudio').srcObject=s;});}
}catch(e){alert('Mic Allow দাও!');}
}else{
if(localStream) localStream.getTracks().forEach(t=>t.stop()); localStream=null; voiceOn=false;
btn.innerText='🎤 VOICE ON'; btn.style.background='#f1c40f'; btn.style.color='#000'; vs.innerText='🎤 OFF'; showMsg('Voice OFF','orange');
}
}
function genCode(){return 'BRA-'+Math.floor(1000+Math.random()*9000);}
function createRoom(){
let code=genCode(); myId=code; isHost=true;
document.getElementById('myCode').innerText=code; document.getElementById('roomBox').style.display='block';
document.getElementById('multiStatus').innerText='Room: '+code;
if(peer) try{peer.destroy();}catch(e){}
peer=new Peer(code);
peer.on('open',id=>{document.getElementById('net').innerText='HOST '+id; document.getElementById('waitStatus').innerText='বন্ধুর অপেক্ষা...';});
peer.on('connection',c=>{conn=c; conn.on('open',()=>{document.getElementById('waitStatus').innerText='✅ বন্ধু এসেছে! START চাপো'; document.getElementById('startBtn').style.display='block'; document.getElementById('multiStatus').innerText='✅ CONNECTED!'; showMsg('বন্ধু Join!','green');}); conn.on('data',handleData);});
peer.on('call',c=>{if(localStream) c.answer(localStream); else c.answer(); c.on('stream',s=>{document.getElementById('remoteAudio').srcObject=s; showMsg('🔊 Voice Connected!','green');});});
}
function joinRoom(){
let code=document.getElementById('joinCode').value.trim().toUpperCase(); if(!code){alert('Code লিখো!'); return;}
myId=code; isHost=false; document.getElementById('multiStatus').innerText='Joining '+code+'...';
if(peer) try{peer.destroy();}catch(e){}
peer=new Peer();
peer.on('open',()=>{conn=peer.connect(code); conn.on('open',()=>{document.getElementById('multiStatus').innerText='✅ CONNECTED!'; document.getElementById('net').innerText='JOINED'; document.getElementById('roomBox').style.display='block'; document.getElementById('myCode').innerText=code; document.getElementById('waitStatus').innerText='Host START দিবে...'; if(voiceOn){let c=peer.call(code, localStream); c.on('stream',s=>{document.getElementById('remoteAudio').srcObject=s;});}}); conn.on('data',handleData);});
peer.on('call',c=>{if(localStream) c.answer(localStream); else c.answer(); c.on('stream',s=>{document.getElementById('remoteAudio').srcObject=s;});});
}
function handleData(d){if(d.t=='start') startMulti(false); if(d.t=='sync' && !isHost){ball=d.ball; ballV=d.ballV; if(opp[0]){opp[0].x=d.opp.x; opp[0].y=d.opp.y;}} if(d.t=='goal'){scoreM=d.scoreM; scoreO=d.scoreO; document.getElementById('score').innerText=`BRA ${scoreM}-${scoreO} ARS`; showMsg(d.msg,'green'); setTimeout(()=>{if(isMulti)initMulti(); else initGame();},1200);}}
function shareCode(){let code=document.getElementById('myCode').innerText; let txt=`Match খেলো Voice এ কথা বলে! Code: ${code} - ${location.href}`; window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');}

// GAME - 2 GK SYSTEM
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'); let W=0,H=0; function rs(){W=cv.width=cv.parentElement.clientWidth*2; H=cv.height=cv.parentElement.clientHeight*2;} rs(); window.onresize=rs;
let run=false, players=[], my=[], opp=[], gk=[], ball={x:100,y:100}, ballV={x:0,y:0}, owner=null, active=0, scoreM=0, scoreO=0, t=0, timer=null, joy={dx:0,dy:0,a:false};

function initGame(){players=[]; my=[]; opp=[]; gk=[]; owner=null; ballV={x:0,y:0}; let fw=W, fh=H; let me={x:200,y:fh/2,team:'my',num:'8',c:'#ff0000'}; let op={x:fw-200,y:fh/2,team:'opp',num:'10',c:'#3498db'}; players=[me,op]; my=[me]; opp=[op]; gk.push({x:50,y:fh/2-25,c:'#f1c40f',team:'my',d:false}); gk.push({x:20,y:fh/2+25,c:'#00ff00',team:'my',d:false}); gk.push({x:fw-50,y:fh/2-25,c:'#f1c40f',team:'opp',d:false}); gk.push({x:fw-20,y:fh/2+25,c:'#00ff00',team:'opp',d:false}); active=0; ball={x:me.x+28,y:me.y}; owner=me;}
function initMulti(){initGame();}
function startOffline(){scoreM=0; scoreO=0; t=0; hideAll(); isMulti=false; initGame(); run=true; clearInterval(timer); timer=setInterval(()=>{t++; let mm=String(Math.floor(t/60)).padStart(2,'0'); let ss=String(t%60).padStart(2,'0'); document.getElementById('time').innerText=mm+':'+ss;},1000); loop();}
function startMulti(send){if(send&&conn&&isHost) conn.send({t:'start'}); isMulti=true; scoreM=0; scoreO=0; t=0; hideAll(); initMulti(); run=true; clearInterval(timer); timer=setInterval(()=>{t++; let mm=String(Math.floor(t/60)).padStart(2,'0'); let ss=String(t%60).padStart(2,'0'); document.getElementById('time').innerText=mm+':'+ss;},1000); if(isHost) loop(); else loopMulti();}

function checkGK(){let fw=W, fh=H; for(let g of gk){if(Math.hypot(ball.x-g.x,ball.y-g.y)<100 && !owner && Math.hypot(ballV.x,ballV.y)>1){if(g.team=='opp' && ball.x>fw-180 && Math.random()<0.7){g.d=true; showMsg('🧤 GK SAVE!','red'); ball={x:g.x,y:g.y}; ballV={x:0,y:0}; setTimeout(()=>{ball={x:g.x-50,y:g.y}; ballV={x:-8,y:0}; owner=null; g.d=false;},600); return true;} if(g.team=='my' && ball.x<180 && Math.random()<0.7){g.d=true; showMsg('🧤 তোমার GK SAVE!','green'); ball={x:g.x,y:g.y}; ballV={x:0,y:0}; setTimeout(()=>{ball={x:g.x+50,y:g.y}; ballV={x:8,y:0}; owner=null; g.d=false;},600); return true;}}} return false;}
function checkGoal(){let fw=W, fh=H; if(ball.x>fw-28 && ball.y>fh*0.32 && ball.y<fh*0.58){if(checkGK()) return true; scoreM++; COIN+=20; upd(); document.getElementById('score').innerText=`BRA ${scoreM}-${scoreO} ARS`; if(isMulti&&conn) conn.send({t:'goal',scoreM,scoreO,msg:'GOAL! 🎉'}); showMsg('GOAL! 🎉 +20','green'); setTimeout(()=>{if(isMulti)initMulti(); else initGame();},1000); return true;} if(ball.x<28 && ball.y>fh*0.32 && ball.y<fh*0.58){scoreO++; document.getElementById('score').innerText=`BRA ${scoreM}-${scoreO} ARS`; if(isMulti&&conn) conn.send({t:'goal',scoreM,scoreO,msg:'Opp Goal'}); showMsg('Opp Goal','red'); setTimeout(()=>{if(isMulti)initMulti(); else initGame();},1000); return true;} if(ball.x<0||ball.x>fw||ball.y<0||ball.y>fh){if(isMulti)initMulti(); else initGame(); return true;} return false;}

function doTackle(){if(!my[active]) return; let tar=opp[0]; if(Math.hypot(my[active].x-tar.x,my[active].y-tar.y)<65){owner=my[active]; ballV={x:0,y:0}; ball.x=my[active].x+22; ball.y=my[active].y; showMsg('TACKLE!','green');}}
function doShoot(){if(!owner||!my.includes(owner)) return; let gy=H*0.45+(Math.random()-0.5)*80; let ang=Math.atan2(gy-ball.y,W-ball.x); ballV.x=Math.cos(ang)*16; ballV.y=Math.sin(ang)*16; owner=null;}
function doPass(){}

document.getElementById('tBtn').addEventListener('touchstart',doTackle,{passive:false});
document.getElementById('sBtn').addEventListener('touchstart',doShoot,{passive:false});
const joyEl=document.getElementById('joy'), stickEl=document.getElementById('stick');
joyEl.addEventListener('touchstart',e=>{joy.a=true; e.preventDefault();},{passive:false});
joyEl.addEventListener('touchmove',e=>{
let r=joyEl.getBoundingClientRect(); let tt=e.touches[0];
let dx=tt.clientX-(r.left+42), dy=tt.clientY-(r.top+42);
let d=Math.min(42,Math.hypot(dx,dy)), ang=Math.atan2(dy,dx);
joy.dx=Math.cos(ang)*d/42; joy.dy=Math.sin(ang)*d/42;
stickEl.style.left=23+joy.dx*26+'px'; stickEl.style.top=23+joy.dy*26+'px';
e.preventDefault();
},{passive:false});
joyEl.addEventListener('touchend',()=>{joy.a=false; joy.dx=0; joy.dy=0; stickEl.style.left='23px'; stickEl.style.top='23px';});

function drawField(){let fw=W, fh=H; ctx.fillStyle='#1a8a1a'; ctx.fillRect(0,0,fw,fh); ctx.fillStyle='#222'; ctx.fillRect(0,0,fw,68); ctx.font='bold 20px Arial'; ctx.fillText('🇧🇷',28,42); ctx.fillText('🇦🇷',fw-52,42); ctx.fillStyle='#000'; ctx.fillRect(20,68,fw-40,16); ctx.fillStyle='#ff0'; ctx.font='10px Arial'; ctx.fillText(isMulti?'🌐🎤 MATCH VOICE '+myId+' - 2 GK':'GK SYSTEM - 2 GK PER SIDE',30,78); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.strokeRect(20,90,fw-40,fh-144); ctx.beginPath(); ctx.moveTo(fw/2,90); ctx.lineTo(fw/2,fh-54); ctx.stroke(); ctx.beginPath(); ctx.arc(fw/2,fh/2,78,0,Math.PI*2); ctx.stroke(); ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.strokeRect(20,fh/2-68,12,136); ctx.strokeRect(fw-32,fh/2-68,12,136);}
function loop(){if(!run||isMulti) return; let me=my[active]; if(me&&joy.a){me.x+=joy.dx*5; me.y+=joy.dy*5; me.x=Math.max(40,Math.min(W-40,me.x)); me.y=Math.max(98,Math.min(H-58,me.y)); if(owner==me){ball.x=me.x+26; ball.y=me.y+4;}} if(!owner){ball.x+=ballV.x; ball.y+=ballV.y; ballV.x*=0.983; ballV.y*=0.983; if(!checkGoal()){for(let p of players){if(Math.hypot(ball.x-p.x,ball.y-p.y)<35&&Math.hypot(ballV.x,ballV.y)<5){owner=p; ballV={x:0,y:0}; break;}}}} ctx.clearRect(0,0,W,H); drawField(); players.forEach(p=>{ctx.save(); ctx.translate(p.x,p.y); ctx.fillStyle=p.c; ctx.fillRect(-12,-18,24,18); ctx.fillStyle='#ffdbac'; ctx.beginPath(); ctx.arc(0,-26,9,0,Math.PI*2); ctx.fill(); ctx.restore();}); gk.forEach(g=>{ctx.save(); ctx.translate(g.x,g.y); if(g.d) ctx.translate(0,-15); ctx.fillStyle=g.c; ctx.fillRect(-14,-16,28,22); ctx.fillStyle='#fff'; ctx.font='bold 16px Arial'; ctx.textAlign='center'; ctx.fillText('🧤',0,0); ctx.restore();}); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ball.x,ball.y,10,0,Math.PI*2); ctx.fill(); if(isMulti&&conn&&isHost) conn.send({t:'sync',ball,ballV,opp:{x:opp[0].x,y:opp[0].y}}); requestAnimationFrame(loop);}
function loopMulti(){if(!run||!isMulti) return; if(isHost){let me=my[0]; if(me&&joy.a){me.x+=joy.dx*5; me.y+=joy.dy*5; me.x=Math.max(40,Math.min(W-40,me.x)); me.y=Math.max(98,Math.min(H-58,me.y)); if(owner==me){ball.x=me.x+26; ball.y=me.y+4;}} if(!owner){ball.x+=ballV.x; ball.y+=ballV.y; ballV.x*=0.983; ballV.y*=0.983; checkGoal();} if(conn) conn.send({t:'sync',ball,ballV,opp:{x:opp[0].x,y:opp[0].y}});}else{let op=opp[0]; if(op&&joy.a){op.x+=joy.dx*5; op.y+=joy.dy*5; op.x=Math.max(40,Math.min(W-40,op.x)); op.y=Math.max(98,Math.min(H-58,op.y)); if(owner==op){ball.x=op.x+16; ball.y=op.y;}}} ctx.clearRect(0,0,W,H); drawField(); players.forEach(p=>{ctx.save(); ctx.translate(p.x,p.y); ctx.fillStyle=p.c; ctx.fillRect(-12,-18,24,18); ctx.fillStyle='#ffdbac'; ctx.beginPath(); ctx.arc(0,-26,9,0,Math.PI*2); ctx.fill(); ctx.restore();}); gk.forEach(g=>{ctx.save(); ctx.translate(g.x,g.y); ctx.fillStyle=g.c; ctx.fillRect(-14,-16,28,22); ctx.fillStyle='#fff'; ctx.font='bold 16px Arial'; ctx.textAlign='center'; ctx.fillText('🧤',0,0); ctx.restore();}); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ball.x,ball.y,10,0,Math.PI*2); ctx.fill(); requestAnimationFrame(loopMulti);}
</script>
</body>
</html>
