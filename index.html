<style>
*{box-sizing:border-box;touch-action:none;margin:0} body{background:#0a160a;color:#fff;font-family:Arial;overflow:hidden}
.top{position:absolute;top:0;width:100%;height:46px;background:#000;display:flex;justify-content:space-between;align-items:center;padding:0 10px;z-index:20;border-bottom:2px solid #2ecc71;font-weight:bold;font-size:13px}

#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000e;border:2px solid #f1c40f;padding:14px 22px;border-radius:12px;z-index:40;display:none;text-align:center;font-weight:bold;font-size:18px}
.hidden{display:none}

<body>
<div class="top"><span id="score">BRA 0-0 ARS</span><span class="coin" id="coinTxt">💰 500</span><span id="time">00:00</span></div>
<div id="field"><canvas id="cv"></canvas><div id="msg"></div><button onclick="goMenu()" style="position:absolute;top:8px;left:8px;z-index:15;background:#0008;color:#fff;border:1px solid #fff;padding:5px 10px;border-radius:6px;font-size:11px">← MENU</button></div>

<div id="main" class="screen">

</div>

<div id="shop" class="screen hidden">

</div>
</div>

<script>
const CHARS=[
 {id:'hamza', name:'Hamza BD 8', price:500, color:'#ff0000', power:84, emoji:'🇧🇩', shorts:'#006A4E'},
 {id:'ronaldo', name:'Ronaldo 7', price:500, color:'#ff0000', power:96, emoji:'👑', shorts:'#006633'},
 {id:'messi', name:'Messi 10', price:500, color:'#75aadb', power:97, emoji:'🐐', shorts:'#fff'},
 {id:'mbappe', name:'Mbappe 10', price:500, color:'#002395', power:94, emoji:'🚀', shorts:'#fff'},
 {id:'dybala', name:'Dybala 10', price:500, color:'#000', power:88, emoji:'💎', shorts:'#000'},
 {id:'martinez', name:'Martinez 23', price:500, color:'#75aadb', power:87, emoji:'🧤', shorts:'#fff'},
 {id:'neymar', name:'Neymar 10', price:500, color:'#ffeb3b', power:90, emoji:'⚡', shorts:'#008000'},
 {id:'haaland', name:'Haaland 9', price:500, color:'#6cabdd', power:92, emoji:'💪', shorts:'#00285e'},
];
function getD(){return JSON.parse(localStorage.getItem('dls_cool_500')||'{"coin":500,"owned":["hamza"],"team":["hamza"]}')}
function saveD(d){localStorage.setItem('dls_cool_500',JSON.stringify(d)); updCoin()}
function updCoin(){let d=getD(); document.getElementById('coinTxt').innerText='💰 '+d.coin; document.getElementById('menuCoin').innerText=d.coin; let s=document.getElementById('shopCoin'); if(s) s.innerText=d.coin;}
updCoin();
function downloadGame(){let html=document.documentElement.outerHTML; let blob=new Blob([html],{type:'text/html'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='DLS26-Cool-500-Coin.html'; a.click(); URL.revokeObjectURL(url); alert('✅ Download হয়েছে! Downloads ফোল্ডারে দেখো!')}
function openShop(){document.getElementById('main').classList.add('hidden'); document.getElementById('shop').classList.remove('hidden'); let d=getD(); let g=document.getElementById('shopGrid'); g.innerHTML=''; CHARS.forEach(ch=>{let ow=d.owned.includes(ch.id); let div=document.createElement('div'); div.className='item '+(ow?'owned':''); div.innerHTML=`<div class="emoji">${ch.emoji}</div><b style="font-size:12px">${ch.name}</b><div style="font-size:11px">Power ${ch.power}</div><div class="price">500 coin</div><button class="buy" ${ow?'disabled':''} onclick="buyChar('${ch.id}')">${ow?'OWNED ✅':'BUY 500'}</button>`; g.appendChild(div);});}
function buyChar(id){let d=getD(); if(d.owned.includes(id)) return; if(d.coin<500){alert('Coin কম! আছে '+d.coin); return;} d.coin-=500; d.owned.push(id); saveD(d); openShop(); alert('কিনেছো! ✅')}
function openTeam(){document.getElementById('main').classList.add('hidden'); document.getElementById('team').classList.remove('hidden'); renderTeam();}
function renderTeam(){let d=getD(); let sl=document.getElementById('slots'); sl.innerHTML=''; for(let i=0;i<5;i++){let pid=d.team[i]; let ch=CHARS.find(c=>c.id==pid); let div=document.createElement('div'); div.style.cssText='border:2px '+(ch?'solid':'dashed')+' '+(ch?'#2ecc71':'#334155')+';border-radius:8px;padding:10px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;background:'+(ch?'#123212':'transparent'); div.innerHTML=`<span>Slot ${i+1}: ${ch?ch.emoji+' '+ch.name:'খালি'}</span><button onclick="clearSlot(${i})" style="padding:4px 8px;background:#333;color:#fff;border:none;border-radius:4px">X</button>`; sl.appendChild(div);} let list=document.getElementById('owned'); list.innerHTML=''; d.owned.forEach(id=>{let ch=CHARS.find(c=>c.id==id); let b=document.createElement('button'); b.style.cssText='padding:6px 10px;background:#222;color:#fff;border:1px solid #2ecc71;border-radius:20px;font-size:12px'; b.innerText=ch.emoji+' '+ch.name; b.onclick=()=>addTeam(id); list.appendChild(b);});}
function addTeam(id){let d=getD(); if(d.team.includes(id)){alert('Already আছে'); return;} if(d.team.length>=5){alert('Full 5 জন'); return;} d.team.push(id); saveD(d); renderTeam();}
function clearSlot(i){let d=getD(); d.team.splice(i,1); saveD(d); renderTeam();}
function openPlay(){document.getElementById('main').classList.add('hidden'); document.getElementById('play').classList.remove('hidden');}
function backMain(){document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); document.getElementById('main').classList.remove('hidden'); updCoin();}

// COOL CHARACTER ENGINE - Shin-pad + Jersey
const canvas=document.getElementById('cv'), ctx=canvas.getContext('2d'); let W,H; function rs(){W=canvas.width=canvas.parentElement.clientWidth*2; H=canvas.height=canvas.parentElement.clientHeight*2} rs(); window.onresize=rs;
let mode=1, run=false, players=[], my=[], opp=[], ball={x:0,y:0}, ballV={x:0,y:0}, owner=null, active=0, scoreM=0, scoreO=0, t=0, timer, joy={dx:0,dy:0,a:false};
class CoolPlayer{
 constructor(x,y,team,num,color,shorts,emoji){this.x=x;this.y=y;this.team=team;this.num=num;this.color=color;this.shorts=shorts;this.emoji=emoji;this.vx=0;this.vy=0;this.red=false}
 draw(){
   if(this.red) return; ctx.save(); ctx.translate(this.x,this.y);
   ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(0,22,20,8,0,0,Math.PI*2); ctx.fill();
   let moving=Math.hypot(this.vx,this.vy)>0.6; let swing=moving?Math.sin(Date.now()*0.014+this.x)*10:0;
   // Shin-pad like image
   ctx.fillStyle='#fff'; ctx.fillRect(-8+swing,8,7,16); ctx.fillRect(4-swing,8,7,16);
   ctx.fillStyle=this.color; ctx.fillRect(-8+swing,8,7,10); ctx.fillRect(4-swing,8,7,10);
   // shorts
   ctx.fillStyle=this.shorts; ctx.fillRect(-11,-2,22,12);
   // jersey
   ctx.fillStyle=this.color; ctx.fillRect(-14,-20,28,20);
   ctx.fillStyle='#000'; ctx.font='bold 14px Arial'; ctx.textAlign='center'; ctx.fillText(this.num,0,-4);
   // head + hair cool
   ctx.fillStyle='#ffdbac'; ctx.beginPath(); ctx.arc(0,-28,10,0,Math.PI*2); ctx.fill();
   ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(0,-36,11,0,Math.PI*1); ctx.fill();
   if(this.emoji=='👑'){ctx.fillStyle='#f1c40f'; ctx.fillRect(-3,-40,6,4);}
   ctx.restore();
   if(this.team=='my'&&players.indexOf(this)==active){ctx.strokeStyle='#ff0'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(this.x,this.y,24,0,Math.PI*2); ctx.stroke();}
 }
}
function msg(txt,c='#ff0',ms=1400){let m=document.getElementById('msg'); m.innerHTML=txt; m.style.borderColor=c; m.style.display='block'; setTimeout(()=>m.style.display='none',ms);}
function initT(){players=[]; my=[]; opp=[]; owner=null; ballV={x:0,y:0}; let d=getD(); let chars=d.team.map(id=>CHARS.find(c=>c.id==id)).filter(Boolean); if(chars.length==0) chars=[CHARS[0]]; let fw=W,fh=H; if(mode==1){let ch=chars[0]; let me=new CoolPlayer(240,fh-130,'my',ch.name.split(' ')[1],ch.color,ch.shorts,ch.emoji); players.push(me); my.push(me); active=0; for(let i=0;i<4;i++){let p=new CoolPlayer(fw/2-70+i*40,fh*0.48,'opp',i+2,'#3498db','#0022aa',''); players.push(p); opp.push(p);} let gk=new CoolPlayer(fw-180,fh*0.48,'opp',1,'#f1c40f','#000',''); players.push(gk); opp.push(gk); ball={x:me.x+32,y:me.y}; owner=me;} else if(mode==2){let ch=chars[0]; let me=new CoolPlayer(200,fh/2,'my',ch.name.split(' ')[1],ch.color,ch.shorts,ch.emoji); let o=new CoolPlayer(fw-300,fh/2,'opp','5','#3498db','#0022aa',''); players=[me,o]; my=[me]; opp=[o]; active=0; ball={x:me.x+28,y:me.y}; owner=me;} else {let myPos=[[180,fh/2],[310,fh*0.28],[310,fh*0.72],[430,fh*0.35],[430,fh*0.65]]; let oppPos=[[W-180,fh/2],[W-310,fh*0.28],[W-310,fh*0.72],[W-430,fh*0.35],[W-430,fh*0.65]]; myPos.forEach((p,i)=>{let ch=chars[i%chars.length]; let pl=new CoolPlayer(p[0],p[1],'my',ch.name.split(' ')[1],ch.color,ch.shorts,ch.emoji); players.push(pl); my.push(pl)}); oppPos.forEach(p=>{let pl=new CoolPlayer(p[0],p[1],'opp',p[2],'#3498db','#0022aa',''); players.push(pl); opp.push(pl)}); active=0; ball={x:my[0].x+28,y:my[0].y}; owner=my[0];} document.getElementById('score').innerText=mode==3?`BRA ${scoreM}-${scoreO} ARS`:`BD ${scoreM}-${scoreO} OPP`;}
function startGame(m){mode=m; scoreM=0; scoreO=0; t=0; document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); initT(); run=true; clearInterval(timer); timer=setInterval(()=>{t++; let mm=String(Math.floor(t/60)).padStart(2,'0'); let ss=String(t%60).padStart(2,'0'); document.getElementById('time').innerText=mm+':'+ss},1000); loop();}
function checkG(){let fw=W,fh=H; if(ball.x>fw-40&&ball.y>fh*0.32&&ball.y<fh*0.58){scoreM++; document.getElementById('score').innerText=mode==3?`BRA ${scoreM}-${scoreO} ARS`:`BD ${scoreM}-${scoreO} OPP`; msg('GOAL! ⚽ +10 coin','green',1500); let d=getD(); d.coin+=10; saveD(d); setTimeout(initT,1200); return true;} if(ball.x<40&&ball.y>fh*0.32&&ball.y<fh*0.58){scoreO++; msg('Opp Goal','red'); setTimeout(initT,1000); return true;} if(ball.x<0||ball.x>fw||ball.y<0||ball.y>fh){initT(); return true;} return false;}
function tackle(){let me=my[active]; if(!me||me.red) return; let tar=owner&&opp.includes(owner)?owner:opp.reduce((a,b)=>Math.hypot(ball.x-a.x,ball.y-a.y)<Math.hypot(ball.x-b.x,ball.y-b.y)?a:b); if(Math.hypot(me.x-tar.x,me.y-tar.y)<64){owner=me; ballV={x:0,y:0}; ball.x=me.x+24; ball.y=me.y; msg('TACKLE!','green',600);}}
function shoot(){if(!owner||!my.includes(owner)) return; let fw=W,fh=H; let gy=fh*0.46+(Math.random()-0.5)*70; let ang=Math.atan2(gy-ball.y,fw-ball.x); let pow=16+owner.power*0.05; ballV.x=Math.cos(ang)*pow; ballV.y=Math.sin(ang)*pow; owner=null;}
function pass(){if(!owner||!my.includes(owner)||mode==1) return; let cur=my[active]; let best=null,d=999; my.forEach((p,i)=>{if(i!=active){let dist=Math.hypot(p.x-cur.x,p.y-cur.y); if(dist>50&&dist<d){d=dist; best=p}}}); if(best){let ang=Math.atan2(best.y-ball.y,best.x-ball.x); ballV.x=Math.cos(ang)*11; ballV.y=Math.sin(ang)*11; owner=null;}}
document.getElementById('bTackle').addEventListener('touchstart',tackle); document.getElementById('bShoot').addEventListener('touchstart',shoot); document.getElementById('bPass').addEventListener('touchstart',pass);
const joyEl=document.getElementById('joy'), stickEl=document.getElementById('stick'); joyEl.addEventListener('touchstart',e=>{joy.a=true; e.preventDefault()},{passive:false}); joyEl.addEventListener('touchmove',e=>{let r=joyEl.getBoundingClientRect(); let tt=e.touches[0]; let dx=tt.clientX-(r.left+55), dy=tt.clientY-(r.top+55); let d=Math.min(50,Math.hypot(dx,dy)), ang=Math.atan2(dy,dx); joy.dx=Math.cos(ang)*d/50; joy.dy=Math.sin(ang)*d/50; stickEl.style.left=33+joy.dx*32+'px'; stickEl.style.top=33+joy.dy*32+'px'; e.preventDefault();},{passive:false}); joyEl.addEventListener('touchend',()=>{joy.a=false; joy.dx=0; joy.dy=0; stickEl.style.left='33px'; stickEl.style.top='33px';});
function loop(){if(!run) return; let me=my[active]; if(me&&!me.red&&joy.a){me.vx=joy.dx*5; me.vy=joy.dy*5; me.x+=me.vx; me.y+=me.vy; me.x=Math.max(30,Math.min(W-30,me.x)); me.y=Math.max(30,Math.min(H-30,me.y)); if(owner==me){ball.x=me.x+28; ball.y=me.y+4;}} if(!owner){ball.x+=ballV.x; ball.y+=ballV.y; ballV.x*=0.983; ballV.y*=0.983; if(checkG()){} for(let p of players){if(Math.hypot(ball.x-p.x,ball.y-p.y)<34&&Math.hypot(ballV.x,ballV.y)<5){owner=p; if(my.includes(p)) active=my.indexOf(p); ballV={x:0,y:0}; break;}}} if(mode>=2){opp.forEach(o=>{if(owner&&my.includes(owner)){o.x+=(ball.x-o.x)*0.03; o.y+=(ball.y-o.y)*0.03;} else if(!owner&&o==opp.reduce((a,b)=>Math.hypot(ball.x-a.x,ball.y-a.y)<Math.hypot(ball.x-b.x,ball.y-b.y)?a:b)){o.x+=(ball.x-o.x)*0.04; o.y+=(ball.y-o.y)*0.04;} else if(owner==o){o.x+=2.8; ball.x=o.x+16; ball.y=o.y; if(Math.random()<0.02){ballV.x=-11; ballV.y=(Math.random()-0.5)*6; owner=null;}}});} ctx.clearRect(0,0,W,H); ctx.fillStyle='#2ea62e'; ctx.fillRect(0,0,W,H); ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.strokeRect(20,20,W-40,H-40); ctx.beginPath(); ctx.moveTo(W/2,20); ctx.lineTo(W/2,H-20); ctx.stroke(); ctx.beginPath(); ctx.arc(W/2,H/2,90,0,Math.PI*2); ctx.stroke(); ctx.fillStyle='#fff'; ctx.fillRect(0,H*0.32,14,H*0.26); ctx.fillRect(W-14,H*0.32,14,H*0.26); players.forEach(p=>p.draw()); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ball.x,ball.y,11,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.stroke(); requestAnimationFrame(loop);}
function goMenu(){run=false; clearInterval(timer); document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); document.getElementById('main').classList.remove('hidden');}
</script>
</body><script>
// FIXED SHOOT - Direct Goal হবে না
function shoot(){
 if(!owner||!my.includes(owner)) return;
 let fw=W, fh=H;
 let gy=fh*0.46+(Math.random()-0.5)*90; // গোলের ভিতরে Random
 let ang=Math.atan2(gy-ball.y,fw-ball.x);
 
 // GK Save Chance 60% - কষ্ট করে গোল দিতে হবে
 let isSave = Math.random() < 0.6; 
 let pow = 14 + Math.random()*4;

 if(mode==1){
   // Wall এ লাগার চান্স
   if(Math.random()<0.35){ 
     msg('WALL BLOCK! 🧱','orange'); 
     ballV.x = -4; ballV.y = (Math.random()-0.5)*8; 
     owner=null; return;
   }
   if(isSave){
     msg('GK SAVE! 🧤','red'); 
     // GK এর কাছে বল যাবে
     ballV.x=Math.cos(ang)*pow; ballV.y=Math.sin(ang)*pow;
     setTimeout(()=>{let gk=opp[opp.length-1]; if(gk){ball.x=gk.x; ball.y=gk.y; owner=gk; ballV={x:0,y:0}}},400);
     owner=null; return;
   }
 }
 
 ballV.x=Math.cos(ang)*pow; ballV.y=Math.sin(ang)*pow; 
 owner=null;
}

// FIXED OPPONENT - তোমার কাছ থেকে বল নেবে
// loop() এর ভিতরে Opponent AI এখন আরো Strong
opp.forEach(o=>{
  if(owner && my.includes(owner)){
    // তুমি বল নিয়ে থাকলে ২ জন Press করবে
    o.x+=(ball.x-o.x)*0.038; 
    o.y+=(ball.y-o.y)*0.038;
    if(Math.hypot(o.x-ball.x, o.y-ball.y)<38 && Math.random()<0.04){
      owner=o; ballV={x:0,y:0}; msg('BALL LOST! 😫','red',800);
      if(my.includes(my[active])){active=Math.floor(Math.random()*my.length)}
    }
  }
});
</script>
