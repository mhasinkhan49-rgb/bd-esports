<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Free Fire Style 3D Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Lobby UI */
        #lobby-screen {
            background: linear-gradient(135deg, #120700 0%, #2a0e00 50%, #080300 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            z-index: 10;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #ff6600;
        }

        .profile-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-box input {
            background: rgba(255,255,255,0.1);
            border: 1px solid #ffaa00;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            width: 120px;
        }

        .level-badge {
            background: #ff6600;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .currency-box {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }

        .mode-container {
            text-align: center;
            margin: 15px 0;
        }

        .mode-select {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: rgba(0,0,0,0.6);
            border: 1px solid #ff6600;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .mode-btn.selected {
            background: #ff6600;
            font-weight: bold;
            box-shadow: 0 0 10px #ff6600;
        }

        .btn {
            background: linear-gradient(180deg, #ff8800 0%, #cc4400 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 102, 0, 0.4);
        }

        .btn-start {
            padding: 15px 40px;
            font-size: 22px;
            background: linear-gradient(180deg, #ffaa00 0%, #ff3300 100%);
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.8);
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Modals */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 20, 0.95);
            border: 2px solid #ff6600;
            border-radius: 12px;
            width: 90%;
            max-width: 750px;
            height: 75%;
            padding: 20px;
            display: none;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            z-index: 20;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            color: #ffaa00;
            border-bottom: 2px solid #ff6600;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            overflow-y: auto;
            padding: 5px;
        }

        .card {
            background: rgba(40, 40, 50, 0.8);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card.active {
            border: 2px solid #00ffcc;
            background: rgba(0, 255, 204, 0.1);
        }

        /* In-Game HUD */
        #hud-screen {
            display: none;
        }

        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
        }

        .hud-top {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .bar-container {
            width: 180px;
            height: 14px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            background: #00ff66;
        }

        .bar-text {
            position: absolute;
            top: 0;
            width: 100%;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            line-height: 14px;
        }

        .hud-top-right {
            position: absolute;
            top: 10px;
            right: 10px;
            text-align: right;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        /* Mobile Controls */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
        }

        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 102, 0, 0.7);
            border-radius: 50%;
        }

        .action-btns {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .btn-round {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #fff;
            color: white;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-fire { background: rgba(255, 51, 0, 0.8); width: 75px; height: 75px; font-size: 14px; }
        .btn-gloo { background: rgba(0, 204, 255, 0.8); }
        .btn-reload { background: rgba(255, 204, 0, 0.8); color: #000; }
        .btn-switch { background: rgba(153, 0, 255, 0.8); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <!-- Lobby Layer -->
    <div id="lobby-screen" class="ui-layer interactive">
        <div class="header">
            <div class="profile-box">
                <input type="text" id="player-name" value="NXT GAMER" onchange="saveProfile()">
                <span class="level-badge">Lvl <span id="player-level">1</span></span>
                <span style="font-size: 11px; color: #aaa;">XP: <span id="player-xp">0</span>/10000</span>
            </div>
            <div class="currency-box">
                🪙 <span id="user-gold">100000</span>
            </div>
        </div>

        <div class="mode-container">
            <div class="mode-select">
                <button class="mode-btn" onclick="selectMode('training', this)">Training Ground</button>
                <button class="mode-btn selected" onclick="selectMode('br', this)">BR Match (10 Enemy)</button>
                <button class="mode-btn" onclick="selectMode('1v1', this)">1v1 Match (Unlimited Gloo)</button>
            </div>
            <button class="btn btn-start" onclick="startGame()">START MATCH</button>
        </div>

        <div class="nav-buttons">
            <button class="btn" onclick="openModal('char-modal')">Characters</button>
            <button class="btn" onclick="openModal('dress-modal')">Dressup</button>
            <button class="btn" onclick="openModal('weapon-modal')">Gun Skins</button>
        </div>
    </div>

    <!-- Character Store Modal -->
    <div id="char-modal" class="modal interactive">
        <div class="modal-header">
            <span>CHARACTER STORE (8)</span>
            <button class="btn" onclick="closeModal('char-modal')">X</button>
        </div>
        <div class="grid-container" id="char-list"></div>
    </div>

    <!-- Dressup Modal -->
    <div id="dress-modal" class="modal interactive">
        <div class="modal-header">
            <span>DRESSUP & ACCESSORIES</span>
            <button class="btn" onclick="closeModal('dress-modal')">X</button>
        </div>
        <div class="grid-container" id="dress-list"></div>
    </div>

    <!-- Weapon Store Modal -->
    <div id="weapon-modal" class="modal interactive">
        <div class="modal-header">
            <span>GUN & MELEE SKINS</span>
            <button class="btn" onclick="closeModal('weapon-modal')">X</button>
        </div>
        <div class="grid-container" id="weapon-list"></div>
    </div>

    <!-- In-Game HUD -->
    <div id="hud-screen" class="ui-layer">
        <div class="crosshair"></div>

        <div class="hud-top">
            <div class="bar-container">
                <div id="hp-bar" class="bar-fill"></div>
                <div class="bar-text">HP: <span id="hp-val">200</span>/200</div>
            </div>
        </div>

        <div class="hud-top-right">
            <div>Kills: <span id="kill-count" style="color:#00ffcc;">0</span></div>
            <div>Alive: <span id="alive-count" style="color:#ffcc00;">0</span></div>
        </div>

        <!-- Mobile Controls Overlay -->
        <div id="joystick-zone" class="interactive">
            <div id="joystick-knob"></div>
        </div>

        <div class="action-btns interactive">
            <div style="display:flex; gap:10px;">
                <div class="btn-round btn-switch" onclick="switchGun()">GUN</div>
                <div class="btn-round btn-reload" onclick="reloadGun()">RELOAD</div>
            </div>
            <div style="display:flex; gap:10px;">
                <div class="btn-round btn-gloo" onclick="deployGlooWall()">GLOO<br><span id="gloo-val">∞</span></div>
                <div class="btn-round btn-fire" onclick="shootWeapon()">FIRE</div>
            </div>
        </div>
    </div>

    <script>
        // Profile & Leveling Data
        let playerProfile = {
            name: 'NXT GAMER',
            level: 1,
            xp: 0,
            gold: 100000
        };

        let selectedMode = 'br';
        let activeChar = 'jack';
        let activeDress = 'default';
        let activeGun = 'mp40';
        let activeSecondaryGun = 'desert_eagle';

        // 8 Characters Data
        const characters = {
            'jack': { name: 'জ্যাক (Jack)', price: 0, color: 0x00aaff, owned: true },
            'jackie': { name: 'জ্যাকি (Jackie)', price: 10000, color: 0xff0055, owned: false },
            'jessica': { name: 'জেসিকা (Jessica)', price: 15000, color: 0xaa00ff, owned: false },
            'akkas': { name: 'আক্কাস (Akkas)', price: 20000, color: 0x00ff66, owned: false },
            'korim': { name: 'করিম (Korim)', price: 25000, color: 0xffaa00, owned: false },
            'rofik': { name: 'রফিক (Rofik)', price: 30000, color: 0x00ffff, owned: false },
            'sam': { name: 'স্যাম (Sam)', price: 35000, color: 0xffff00, owned: false },
            'roky': { name: 'রকি (Roky)', price: 40000, color: 0xff3300, owned: false }
        };

        // Dressup Data
        const dressups = {
            'default': { name: 'Normal Clothes', price: 0, owned: true },
            'red_shirt': { name: 'Red T-Shirt', price: 5000, owned: false, hatColor: 0xff0000 },
            'black_pant': { name: 'Black Jeans', price: 8000, owned: false, hatColor: 0x111111 },
            'sunglasses': { name: 'Cool Sunglasses', price: 12000, owned: false, hatColor: 0x000000 }
        };

        // Gun Skins
        const weapons = {
            'mp40': { name: 'MP40', price: 0, damage: 25, ammo: 32, owned: true },
            'ump': { name: 'UMP', price: 10000, damage: 28, ammo: 30, owned: false },
            'xm8': { name: 'XM8', price: 15000, damage: 32, ammo: 30, owned: false },
            'desert_eagle': { name: 'Desert Eagle', price: 8000, damage: 60, ammo: 7, owned: true },
            'ak47': { name: 'AK-47', price: 20000, damage: 38, ammo: 30, owned: false },
            'awm': { name: 'AWM', price: 30000, damage: 150, ammo: 5, owned: false },
            'mini_uzi': { name: 'Mini Uzi', price: 12000, damage: 20, ammo: 25, owned: false },
            'katana': { name: 'Katana Skin', price: 15000, damage: 80, ammo: 1, owned: false },
            'pan': { name: 'Pan Skin', price: 10000, damage: 70, ammo: 1, owned: false }
        };

        // 3D Variables
        let scene, camera, renderer;
        let playerGroup, enemies = [], glooWalls = [];
        let playerHp = 200, kills = 0, aliveEnemies = 0;
        let ammoCurrent = 30;
        let glooWallsCount = 0; // Infinity for 1v1
        let gameActive = false;

        // Joystick Movement Setup
        let moveVector = { x: 0, y: 0 };
        let joystickActive = false;

        function init() {
            renderLobbyUI();
            setup3D();
            setupJoystick();

            // Keyboard Support
            window.addEventListener('resize', onWindowResize);
        }

        function setup3D() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            // Ground Ground
            const groundGeo = new THREE.PlaneGeometry(300, 300);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a7d44 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');

            zone.addEventListener('touchstart', handleJoystickStart, false);
            zone.addEventListener('touchmove', handleJoystickMove, false);
            zone.addEventListener('touchend', handleJoystickEnd, false);
        }

        function handleJoystickStart(e) { joystickActive = true; }
        function handleJoystickMove(e) {
            if (!joystickActive) return;
            const touch = e.touches[0];
            const rect = document.getElementById('joystick-zone').getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);

            let dist = Math.sqrt(dx * dx + dy * dy);
            let maxDist = 35;
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            document.getElementById('joystick-knob').style.transform = `translate(${dx}px, ${dy}px)`;
            moveVector.x = dx / maxDist;
            moveVector.y = dy / maxDist;
        }

        function handleJoystickEnd() {
            joystickActive = false;
            document.getElementById('joystick-knob').style.transform = `translate(0px, 0px)`;
            moveVector = { x: 0, y: 0 };
        }

        // Render Modals & Lobby
        function renderLobbyUI() {
            document.getElementById('player-name').value = playerProfile.name;
            document.getElementById('player-level').innerText = playerProfile.level;
            document.getElementById('player-xp').innerText = playerProfile.xp;
            document.getElementById('user-gold').innerText = playerProfile.gold;

            // Characters List
            let charContainer = document.getElementById('char-list');
            charContainer.innerHTML = '';
            for (let id in characters) {
                let c = characters[id];
                let isEquipped = activeChar === id;
                charContainer.innerHTML += `
                    <div class="card ${isEquipped ? 'active' : ''}">
                        <h4>${c.name}</h4>
                        <p style="color:#ffd700;">${c.owned ? 'Owned' : c.price + ' Gold'}</p>
                        <button class="btn" onclick="buyOrEquipChar('${id}')">
                            ${isEquipped ? 'Equipped' : (c.owned ? 'Equip' : 'Buy')}
                        </button>
                    </div>
                `;
            }

            // Dressup List
            let dressContainer = document.getElementById('dress-list');
            dressContainer.innerHTML = '';
            for (let id in dressups) {
                let d = dressups[id];
                let isEquipped = activeDress === id;
                dressContainer.innerHTML += `
                    <div class="card ${isEquipped ? 'active' : ''}">
                        <h4>${d.name}</h4>
                        <p style="color:#ffd700;">${d.owned ? 'Owned' : d.price + ' Gold'}</p>
                        <button class="btn" onclick="buyOrEquipDress('${id}')">
                            ${isEquipped ? 'Equipped' : (d.owned ? 'Equip' : 'Buy')}
                        </button>
                    </div>
                `;
            }

            // Weapon Skins List
            let weaponContainer = document.getElementById('weapon-list');
            weaponContainer.innerHTML = '';
            for (let id in weapons) {
                let w = weapons[id];
                let isEquipped
