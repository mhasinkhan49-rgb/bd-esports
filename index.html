<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>BD FC 27 - 3 Mode System</title>
<style>
*{box-sizing:border-box;touch-action:none}
body{margin:0;background:#0a1a0a;color:#fff;font-family:Arial;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:10}
#menu{background:linear-gradient(#0f2a0f,#000)}
.card{background:#1a2e1a;border:2px solid #2ecc71;border-radius:16px;padding:20px;width:95%;max-width:400px;text-align:center;box-shadow:0 10px 30px #000}
.modeBtn{width:100%;padding:16px;margin:10px 0;background:linear-gradient(#2ecc71,#1a9c4a);color:#000;border:none;border-radius:12px;font-weight:bold;font-size:16px;display:flex;align-items:center;justify-content:space-between}
.modeBtn:active{transform:scale(0.97)}
.modeBtn span{font-size:24px}
.top{position:absolute;top:0;left:0;width:100%;background:#000;display:flex;justify-content:space-between;padding:8px 12px;z-index:5;font-weight:bold;border-bottom:2px solid #2ecc71}
#field{position:absolute;top:40px;left:0;width:100vw;height:calc(100vh - 140px);background:linear-gradient(#2faa2f,#1d7a1d)}
.goal{position:absolute;width:12px;height:130px;background:#fff;top:50%;transform:translateY(-50%)}
.goal.left{left:0} .goal.right{right:0}
.player{position:absolute;width:32px;height:32px;border-radius:50%;border:2px solid #fff;text-align:center;line-height:30px;font-size:11px;font-weight:bold;will-change:transform}
.me{background:#ffcc00;color:#000;border-color:#000} .me.active{box-shadow:0 0 15px #fff,0 0 25px #ff0;transform:scale(1.4);z-index:20}
.opp{background:#e74c3c} .ars{background:#ff0000} .bra{background:#ffeb3b;color:#000}
.ball{position:absolute;width:20px;height:20px;background:#fff;border:2px solid #000;border-radius:50%;z-index:30}
.controls{position:absolute;bottom:0;width:100%;height:135px;background:#000e;display:flex;justify-content:space-between;padding:10px;z-index:6}
.joy{width:110px;height:110px;background:rgba(255,255,255,0.12);border-radius:50%;position:relative;border:2px solid #fff5}
.stick{width:44px;height:44px;background:#fff;border-radius:50%;position:absolute;left:33px;top:33px}
.cbtn{width:68px;height:68px;border-radius:50%;background:#222;border:2px solid #2ecc71;color:#fff;font-weight:bold;font-size:12px;display:flex;align-items:center;justify-content:center;margin:0 5px}
.cbtn:active{background:#fff;color:#000}
.hidden{display:none}
</style>
</head>
<body>

<!-- MENU - 3 MODE -->
<div id="menu" class="screen">
<div class="card">
<h2 style="color:#2ecc71;margin:0 0 10px">⚽ BD FC 27</h2>
<p style="font-size:13px;color:#aaa;margin-bottom:15px">তুমি যেভাবে চাইছো - 3 টা মোড</p>

<button class="modeBtn" onclick="startMode(1)"><span>🥅</span> 1. ট্রেনিং ফুটবল ম্যাচ <span>▶</span></button>
<p style="font-size:11px;color:#8f8;text-align:left;margin:-5px 0 5px">গোলকিপারকে গোল দাও, গোল হলে আবার চান্স</p>

<button class="modeBtn" onclick="startMode(2)" style="background:linear-gradient(#3498db,#21618c)"><span>⚔️</span> 2. ম্যাচ - 1vs1 <span>▶</span></button>
<p style="font-size:11px;color:#8ab;text-align:left;margin:-5px 0 5px">Opponent থেকে বল কেড়ে গোল দাও</p>

<button class="modeBtn" onclick="startMode(3)" style="background:linear-gradient(#f1c40f,#b7950b)"><span>🏆</span> 3. ফাইনাল ম্যাচ <span>▶</span></button>
<p style="font-size:11px;color:#aa8;text-align:left;margin:-5px 0 10px">Brazil (তুমি) vs Arsenal - 5 vs 5</p>

</div>
</div>

<!-- GAME UI -->
<div id="gameUI" class="hidden">
<div class="top">
<span id="scoreText">BD 0-0</span>
<span id="modeText">TRAINING</span>
<span id="timerText">00:00</span>
</div>
<div id="field">
<div class="goal left"></div><div class="goal right"></div>
<div id="ball" class="ball"></div>
</div>
<div class="controls">
<div class="joy" id="joy"><div class="stick" id="stick"></div></div>
<div style="display:flex;align-items:center">
<div class="cbtn" id="btnPass">PASS / TACKLE</div>
<div class="cbtn" id="btnShoot" style="border-color:#ff4444">SHOOT</div>
</div>
</div>
<button onclick="goMenu()" style="position:absolute;top:45px;left:10px;z-index:7;background:#0008;color:#fff;border:1px solid #fff;padding:4px 10px;border-radius:6px;font-size:12px">← MENU</button>
</div>

<script>
let mode=1, gameOn=false, players=[], myTeam=[], oppTeam=[], activeIdx=0, ballOwner=null, ballV={x:0,y:0}, scoreMe=0, scoreOpp=0, chances=5, time=0, timerInt;
const field=document.getElementById('field'), ballEl=document.getElementById('ball');

function clearPlayers(){field.querySelectorAll('.player').forEach(e=>e.remove()); players=[]; myTeam=[]; oppTeam=[]}

function createP(x,y,cls,label){
 let el=document.createElement('div'); el.className='player '+cls; el.style.left=x+'px'; el.style.top=y+'px'; el.innerText=label;
 field.appendChild(el); let obj={el,x,y,cls,ox:x,oy:y}; players.push(obj); return obj;
}

function startMode(m){
 mode=m; scoreMe=0; scoreOpp=0; time=0; chances=5;
 document.getElementById('menu').classList.add('hidden');
 document.getElementById('gameUI').classList.remove('hidden');
 clearPlayers();
 let fw=field.clientWidth, fh=field.clientHeight;
 if(m==1){
   document.getElementById('modeText').innerText='TRAINING';
   document.getElementById('scoreText').innerText='Goal: 0 | Chance: 5';
   // Player + Goalkeeper
   let p=createP(120,fh/2,'me','YOU');
   let gk=createP(fw-50,fh/2,'opp','GK');
   myTeam=[p]; oppTeam=[gk];
   activeIdx=0; ballOwner=p;
   ballEl.style.left=p.x+25+'px'; ballEl.style.top=p.y+'px';
 } else if(m==2){
   document.getElementById('modeText').innerText='1VS1 MATCH';
   document.getElementById('scoreText').innerText='BD 0-0 OPP';
   let p=createP(100,fh/2,'me','YOU');
   let o=createP(fw-150,fh/2,'opp','OPP');
   myTeam=[p]; oppTeam=[o];
   activeIdx=0; ballOwner=p;
   ballEl.style.left=p.x+25+'px'; ballEl.style.top=p.y+'px';
 } else {
   document.getElementById('modeText').innerText='FINAL: BRA vs ARS';
   document.getElementById('scoreText').innerText='BRA 0-0 ARS';
   // 5 vs 5
   let myPos=[[80,fh/2],[180,fh*0.25],[180,fh*0.75],[300,fh*0.35],[300,fh*0.65]];
   let oppPos=[[fw-80,fh/2],[fw-180,fh*0.25],[fw-180,fh*0.75],[fw-300,fh*0.35],[fw-300,fh*0.65]];
   myPos.forEach((pos,i)=>{let p=createP(pos[0],pos[1],'bra',i==0?'YOU':'BRA'); myTeam.push(p)});
   oppPos.forEach((pos,i)=>{let p=createP(pos[0],pos[1],'ars',i==0?'GK':'ARS'); oppTeam.push(p)});
   activeIdx=0; ballOwner=myTeam[0];
   ballEl.style.left=myTeam[0].x+25+'px'; ballEl.style.top=myTeam[0].y+'px';
 }
 setActive();
 gameOn=true;
 if(timerInt) clearInterval(timerInt);
 timerInt=setInterval(()=>{time++; let mm=String(Math.floor(time/60)).padStart(2,'0'); let ss=String(time%60).padStart(2,'0'); document.getElementById('timerText').innerText=mm+':'+ss},1000);
 loop();
}

function setActive(){
 myTeam.forEach(p=>p.el.classList.remove('active'));
 if(myTeam[activeIdx]) myTeam[activeIdx].el.classList.add('active');
}

let joy={dx:0,dy:0,active:false};
const joyEl=document.getElementById('joy'), stickEl=document.getElementById('stick');
joyEl.addEventListener('touchstart',e=>{joy.active=true; e.preventDefault()},{passive:false});
joyEl.addEventListener('touchmove',e=>{
 let r=joyEl.getBoundingClientRect(); let t=e.touches[0];
 let dx=t.clientX-(r.left+55), dy=t.clientY-(r.top+55);
 let d=Math.min(45,Math.hypot(dx,dy)), ang=Math.atan2(dy,dx);
 joy.dx=Math.cos(ang)*d/45; joy.dy=Math.sin(ang)*d/45;
 stickEl.style.left=33+joy.dx*32+'px'; stickEl.style.top=33+joy.dy*32+'px';
 e.preventDefault();
},{passive:false});
joyEl.addEventListener('touchend',()=>{joy.active=false; joy.dx=0; joy.dy=0; stickEl.style.left='33px'; stickEl.style.top='33px'});

function doAction(){
 // PASS = TACKLE if not owner
 if(!ballOwner || ballOwner.cls.includes('opp') || ballOwner.cls=='ars'){
   // Try tackle
   let me=myTeam[activeIdx];
   let target=mode==1?oppTeam[0]: (ballOwner?ballOwner:oppTeam[0]);
   if(Math.hypot(me.x-target.x, me.y-target.y)<45){
     ballOwner=me; ballV={x:0,y:0};
     ballEl.style.left=me.x+25+'px'; ballEl.style.top=me.y+'px';
   }
 } else {
   // Pass to teammate (mode 3)
   if(mode==3){
     let cur=myTeam[activeIdx]; let best=null, bestD=999;
     myTeam.forEach((p,i)=>{if(i!=activeIdx){let d=Math.hypot(p.x-cur.x,p.y-cur.y); if(d<bestD && d>40){bestD=d; best=p}}});
     if(best){let ang=Math.atan2(best.y-ballEl.offsetTop, best.x-ballEl.offsetLeft); ballV.x=Math.cos(ang)*10; ballV.y=Math.sin(ang)*10; ballOwner=null;}
   }
 }
}
function doShoot(){
 if(!ballOwner || !['me','bra'].some(c=>ballOwner.cls.includes(c))) return;
 let fw=field.clientWidth, fh=field.clientHeight;
 let goalY=fh/2+(Math.random()-0.5)*60;
 let ang=Math.atan2(goalY-ballEl.offsetTop, fw-ballEl.offsetLeft);
 let power=mode==1?12:14;
 ballV.x=Math.cos(ang)*power; ballV.y=Math.sin(ang)*power;
 ballOwner=null;
}

document.getElementById('btnPass').addEventListener('touchstart',doAction);
document.getElementById('btnShoot').addEventListener('touchstart',doShoot);

function loop(){
 if(!gameOn) return;
 let me=myTeam[activeIdx];
 if(joy.active && me){
   me.x+=joy.dx*5; me.y+=joy.dy*5;
   me.x=Math.max(15,Math.min(field.clientWidth-35,me.x));
   me.y=Math.max(15,Math.min(field.clientHeight-35,me.y));
   me.el.style.left=me.x+'px'; me.el.style.top=me.y+'px';
   if(ballOwner==me){ballEl.style.left=me.x+25+'px'; ballEl.style.top=me.y+'px';}
 }
 // ball move
 if(!ballOwner){
   ballEl.style.left=(ballEl.offsetLeft+ballV.x)+'px';
   ballEl.style.top=(ballEl.offsetTop+ballV.y)+'px';
   ballV.x*=0.985; ballV.y*=0.985;
   if(Math.abs(ballV.x)<0.2) ballV.x=0; if(Math.abs(ballV.y)<0.2) ballV.y=0;
   // pickup
   let all=[...myTeam,...oppTeam];
   for(let p of all){
     if(Math.hypot(ballEl.offsetLeft-p.x, ballEl.offsetTop-p.y)<28 && Math.hypot(ballV.x,ballV.y)<4){
       ballOwner=p;
       if(myTeam.includes(p)){activeIdx=myTeam.indexOf(p); setActive();}
       ballV={x:0,y:0}; break;
     }
   }
   // GOAL CHECK
   let bx=ballEl.offsetLeft, by=ballEl.offsetTop, fw=field.clientWidth, fh=field.clientHeight;
   if(bx>fw-14 && by>fh/2-65 && by<fh/2+65){
     // my goal
     if(mode==1){
       scoreMe++; chances--; // training: goal = chance back?
       document.getElementById('scoreText').innerText=`Goal: ${scoreMe} | Chance: ${chances}`;
       alert('GOAL! 🎯 আবার চান্স পাবা!');
       resetBall();
     } else {
       scoreMe++; updateScore();
       alert('GOAL!!! BRAZIL / BD GOAL! ⚽');
       resetBall();
     }
     return;
   }
   if(bx<14 && by>fh/2-65 && by<fh/2+65){
     if(mode==1){
       chances--; document.getElementById('scoreText').innerText=`Goal: ${scoreMe} | Chance: ${chances}`;
       if(chances<=0){alert('Game Over! তোমার গোল: '+scoreMe); goMenu();} else {alert('MISS! চান্স শেষ: '+chances); resetBall();}
     } else {
       scoreOpp++; updateScore(); alert('Opponent Goal!'); resetBall();
     }
     return;
   }
   if(bx<0||bx>fw||by<0||by>fh){resetBall(); return;}
 }
 // Opponent AI (mode 2 & 3) - fixed, not laggy
 if(mode==2 && ballOwner && myTeam.includes(ballOwner)){
   // opponent chase
   let o=oppTeam[0]; o.x+=(ballEl.offsetLeft-o.x)*0.04; o.y+=(ballEl.offsetTop-o.y)*0.04;
   o.el.style.left=o.x+'px'; o.el.style.top=o.y+'px';
   if(Math.hypot(o.x-ballEl.offsetLeft, o.y-ballEl.offsetTop)<30 && ballOwner==myTeam[0]){ballOwner=o; }
 } else if(mode==2 && ballOwner && oppTeam.includes(ballOwner)){
   ballOwner.x+=2; ballOwner.y+=(Math.random()-0.5)*2;
   ballOwner.el.style.left=ballOwner.x+'px'; ballOwner.el.style.top=ballOwner.y+'px';
   ballEl.style.left=ballOwner.x+'px'; ballEl.style.top=ballOwner.y+'px';
   if(Math.random()<0.02){ballV.x=-10; ballV.y=(Math.random()-0.5)*6; ballOwner=null;}
 } else if(mode==3){
   // simple opponent chase only one nearest
   if(!ballOwner || myTeam.includes(ballOwner)){
     let opp=oppTeam.reduce((a,b)=>Math.hypot(ballEl.offsetLeft-a.x,ballEl.offsetTop-a.y)<Math.hypot(ballEl.offsetLeft-b.x,ballEl.offsetTop-b.y)?a:b);
     opp.x+=(ballEl.offsetLeft-opp.x)*0.025; opp.y+=(ballEl.offsetTop-opp.y)*0.025;
     opp.el.style.left=opp.x+'px'; opp.el.style.top=opp.y+'px';
   }
   // keeper in training moves
   if(mode==1){
     let gk=oppTeam[0]; gk.y+=Math.sin(time*0.1)*1.2; gk.el.style.top=gk.y+'px';
     // save logic
     if(!ballOwner && Math.hypot(ballEl.offsetLeft-gk.x, ballEl.offsetTop-gk.y)<35){ballV.x=-6; ballV.y=(Math.random()-0.5)*8; }
   }
 }

 // training keeper move
 if(mode==1){
   let gk=oppTeam[0]; gk.y+=Math.sin(Date.now()*0.003)*1.5;
   if(gk.y<field.clientHeight/2-50) gk.y=field.clientHeight/2-50;
   if(gk.y>field.clientHeight/2+50) gk.y=field.clientHeight/2+50;
   gk.el.style.top=gk.y+'px';
   if(!ballOwner && Math.hypot(ballEl.offsetLeft-gk.x, ballEl.offsetTop-gk.y)<32){ballV.x=-7; ballV.y=(Math.random()-0.5)*8;}
 }

 requestAnimationFrame(loop);
}

function resetBall(){
 let fh=field.clientHeight;
 if(mode==1){
   let p=myTeam[0]; p.x=120; p.y=fh/2; p.el.style.left=p.x+'px'; p.el.style.top=p.y+'px';
   ballOwner=p; ballEl.style.left=p.x+25+'px'; ballEl.style.top=p.y+'px'; ballV={x:0,y:0};
 } else if(mode==2){
   let p=myTeam[0]; p.x=100; p.y=fh/2; p.el.style.left=p.x+'px'; p.el.style.top=p.y+'px';
   let o=oppTeam[0]; o.x=field.clientWidth-150; o.y=fh/2; o.el.style.left=o.x+'px'; o.el.style.top=o.y+'px';
   ballOwner=p; ballEl.style.left=p.x+25+'px'; ballEl.style.top=p.y+'px'; ballV={x:0,y:0};
 } else {
   startMode(3); // reset full
 }
}
function updateScore(){
 if(mode==3) document.getElementById('scoreText').innerText=`BRA ${scoreMe} - ${scoreOpp} ARS`;
 else document.getElementById('scoreText').innerText=`BD ${scoreMe} - ${scoreOpp} OPP`;
}
function goMenu(){
 gameOn=false; if(timerInt) clearInterval(timerInt);
 document.getElementById('gameUI').classList.add('hidden');
 document.getElementById('menu').classList.remove('hidden');
 clearPlayers();
}
</script>
</body>
</html>
